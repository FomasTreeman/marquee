# Runs Claude Code on an issue labelled `claude`, an `@claude` comment or review, or a
# reply to a Needs Decision question, and ends in a PR, a question, or a closed issue.
# Handovers (labels, comments, pushes, the salvaged PR) use CLAUDE_WORKFLOW_TOKEN,
# because GITHUB_TOKEN events wake no workflow and cannot write `.github/workflows/`.
# Bookkeeping uses GITHUB_TOKEN so it does not wake spurious runs. See docs/AUTOMATION.md.

name: Claude

on:
  issues:
    # Only `labeled`: `assigned` and `opened` started duplicate or always-skipped runs,
    # and triage.yml turns `@claude` in a body into the label.
    # `reopened` means a merged fix did not work. The action rejects that event, so the
    # `reopened` job turns it into a handover comment and the agent amends the fix.
    types: [labeled, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# One run per issue at a time, to avoid branch races and parallel usage.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # Posts a handover comment with pick-up-todo.yml's marker, via the PAT so it wakes
  # this workflow (a GITHUB_TOKEN comment would not).
  reopened:
    if: |
      github.event_name == 'issues' && github.event.action == 'reopened' &&
      contains(github.event.issue.labels.*.name, 'claude') &&
      !contains(github.event.issue.labels.*.name, 'no-ai')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.CLAUDE_WORKFLOW_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::CLAUDE_WORKFLOW_TOKEN is not set, so a comment posted here would start nothing. #$NUMBER was reopened and nobody is coming; pick-up-todo.yml will offer it on its next sweep."
            exit 1
          fi
          printf '%s\n%s\n' \
            '<!-- handed-over -->' \
            '@claude this was reopened, so the fix that closed it did not do what was intended. Read the newest comments for what is still wrong and amend the merged pull request rather than starting over.' \
            > reopened.md
          gh issue comment "$NUMBER" --body-file reopened.md
          echo "::notice::#$NUMBER reopened; handed to the agent."

  claude:
    # Waits for the `claude` label rather than `opened`, so the `no-ai` check sees
    # the labels triage.yml settles.
    # `author_association` is a cheap pre-filter; the action's write-access check is
    # the real gate. The comment's association is read first, or a stranger's comment
    # on the owner's issue passes as OWNER. `review.*` covers review payloads.
    # A Needs Decision reply needs no `@claude`; requiring `claude-working` absent
    # excludes the agent's own comments, which read as OWNER.
    # `sender` is used for labels because the payload does not say who applied one.
    if: |
      !contains(github.event.issue.labels.*.name, 'no-ai') &&
      (
        (github.event.action == 'labeled' &&
         github.event.sender.login == github.repository_owner) ||
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                 github.event.comment.author_association ||
                 github.event.review.author_association ||
                 github.event.issue.author_association)
      ) &&
      (
        github.event.label.name == 'claude' ||
        contains(github.event.comment.body, '@claude') ||
        contains(github.event.review.body, '@claude') ||
        (
          github.event_name == 'issue_comment' &&
          !github.event.issue.pull_request &&
          contains(github.event.issue.labels.*.name, 'needs-decision') &&
          !contains(github.event.issue.labels.*.name, 'claude-working')
        )
      )
    runs-on: ubuntu-latest
    # Errs long: a run killed at the limit delivers only what the salvage can save.
    timeout-minutes: 45

    # The action requires the triggering user to have write access; that is the
    # protection. Do not set `allowed_bots` or `allowed_non_write_users` without reading
    # https://github.com/anthropics/claude-code-action/blob/main/docs/security.md
    # Issue text is still untrusted input, hence PRs rather than pushes to main.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read

    steps:
      # `pnpm test` would run a fork's code with this repository's tokens, so a fork
      # PR is refused before the checkout.
      - name: Refuse a pull request from a fork
        if: github.event.issue.pull_request || github.event_name == 'pull_request_review'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$(gh pr view "$NUMBER" --json isCrossRepository --jq .isCrossRepository)" = true ]; then
            echo "::error::#$NUMBER is from a fork. The agent does not run a fork's code with this repository's tokens; bring the branch into this repository first."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: most of the reasoning here lives in commit messages.
          fetch-depth: 0

      # The agent needs the toolchain to run the suite before claiming a fix.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      # After pnpm: `cache: pnpm` asks pnpm where its store is.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libudev-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # The run owns only `claude-working`; board.yml owns every other label.
      # Not PROJECT_TOKEN: it is scoped to projects and cannot write repository labels.
      - name: Mark it in progress
        if: github.event.issue.number && !github.event.issue.pull_request
        env:
          # GITHUB_TOKEN so this label write does not wake another run.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          # Not fatal, but logged: the board reads this label.
          gh issue edit "$NUMBER" --add-label claude-working --remove-label needs-decision \
            || echo "::warning::could not set claude-working on #$NUMBER; the board will show it as untouched"

      # A merged PR that closes an open issue means it was reopened, so the agent
      # starts from that diff. Only PR numbers go into the prompt.
      - name: What has already merged for it
        id: history
        if: github.event.issue.number && !github.event.issue.pull_request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          merged=$(gh api graphql -F owner="${GITHUB_REPOSITORY%/*}" -F repo="${GITHUB_REPOSITORY#*/}" -F number="$NUMBER" -f query='
            query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                issue(number: $number) {
                  closedByPullRequestsReferences(first: 20, includeClosedPrs: true) {
                    nodes { number state }
                  }
                }
              }
            }' --jq '[.data.repository.issue.closedByPullRequestsReferences.nodes[] | select(.state == "MERGED") | "#\(.number)"] | join(", ")')
          if [ -n "$merged" ]; then
            echo "brief=- This issue was already closed by $merged, which is merged and on main, and it has been reopened: that fix did not do what was intended. Read the newest comments on the issue for what is still wrong, start from the diff of that pull request (\`gh pr diff <number>\`) rather than from the issue text, and open a new pull request that amends it. Do not revert it unless the comment asks for that." >> "$GITHUB_OUTPUT"
            echo "::notice::#$NUMBER already has $merged merged; the agent is told to amend rather than start over."
          else
            echo "brief=" >> "$GITHUB_OUTPUT"
          fi

      # `--append-system-prompt-file`, not `--system-prompt-file`, which would drop the
      # action's GitHub context.
      # `gh run`/`gh workflow` are allowed read-only subcommands only. No rerun, cancel or
      # `workflow run` (that cuts a release), no `gh api` (arbitrary writes).
      # `gh pr create` is allowed because the PR is the deliverable.
      - uses: anthropics/claude-code-action@56cf60fde42f7b19c3abfd5c9c48b69a1288461f # v1.0.222
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # PAT if set (see header), else GITHUB_TOKEN.
          github_token: ${{ secrets.CLAUDE_WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}
          track_progress: true
          # In the user prompt so it overrides the action's "post a Create PR link" brief.
          # Setting `prompt` also disables the action's `@claude` check; the `if:` gates.
          prompt: |
            Where these differ from the instructions above, these win.

            - Finish by opening the pull request yourself: `gh pr create --base main --title "..." --body "..."`, with `Closes #<issue number>` as the first line of the body. Do not post a "Create a PR" link; a link is not a deliverable and nobody will click it.
            - You are already on the branch this run made. Stay on it, commit there, `git push -u origin HEAD`.
            - Run `pnpm test` and `cd src-tauri && cargo clippy --all-targets -- -D warnings` before opening the pull request, and say in its body whether they passed. A red pull request that says it is red is fine. Unpushed work is not: if you cannot finish, commit and push what you have and open the pull request with the body saying what is missing.
            - If the issue needs a decision that is not yours, comment the one question with `gh issue comment`, label it with `gh issue edit <number> --add-label needs-decision`, and stop without a pull request. The person's reply restarts you.
            - Do not stop with an unticked list. Every run ends in a pull request, a `needs-decision` question, or the issue closed.
            - If this run was started from a pull request rather than an issue, the pull request already exists: push to its branch and reply there instead.
            ${{ steps.history.outputs.brief }}
          claude_args: |
            --allowed-tools "Bash(cd:*),Bash(pnpm:*),Bash(cargo:*),Bash(node:*),Bash(git:*),Bash(tools/:*),Bash(python3:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh issue view:*),Bash(gh pr create:*),Bash(gh pr edit:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh run list:*),Bash(gh run view:*),Bash(gh workflow list:*),Bash(gh workflow view:*)"
            --append-system-prompt-file .github/claude-instructions.md

      # Decides whether the run delivered, even if it failed. A PR counts only if it
      # closes the issue (`closedByPullRequestsReferences`, as board.mjs reads it), not
      # one that merely mentions it. The next step acts.
      - name: Did it deliver?
        id: deliver
        if: always() && github.event.issue.number && !github.event.issue.pull_request
        env:
          NUMBER: ${{ github.event.issue.number }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # GITHUB_TOKEN: read-only, nothing here is a handover.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs')
            const { owner, repo } = context.repo
            const number = Number(process.env.NUMBER)

            const q = await github.graphql(
              `query($owner: String!, $repo: String!, $number: Int!) {
                 repository(owner: $owner, name: $repo) {
                   issue(number: $number) {
                     state title
                     labels(first: 50) { nodes { name } }
                     closedByPullRequestsReferences(first: 20, includeClosedPrs: true) {
                       nodes { number state }
                     }
                   }
                 }
               }`, { owner, repo, number })

            const issue = q.repository.issue
            const labels = issue.labels.nodes.map((l) => l.name)
            const pr = issue.closedByPullRequestsReferences.nodes.find((p) => p.state === 'OPEN')
            core.setOutput('title', issue.title)

            // Log refused tool calls for every run, so the allowlist can be tuned
            // from successful runs too. Logs are public, so not the transcript.
            let why = 'The action left no execution record, so it probably failed before the agent started.'
            const file = process.env.EXECUTION_FILE
            if (file && fs.existsSync(file)) {
              // A half-written record (timeout) must not throw, or the salvage
              // step never runs and the branch is lost.
              let result
              try {
                result = JSON.parse(fs.readFileSync(file, 'utf8')).find((m) => m.type === 'result')
              } catch (e) {
                why = `The action's execution record could not be read (${e.message}).`
              }
              if (result) {
                const denied = (result.permission_denials || [])
                  .map((d) => `${d.tool_name}: ${JSON.stringify(d.tool_input?.command ?? d.tool_input).slice(0, 120)}`)
                why = `The agent returned after ${result.num_turns} turns`
                  + (result.is_error ? ' with an error' : ' without error')
                  + (denied.length
                      ? `, and was refused ${denied.length} tool call(s):\n${denied.map((d) => `  - ${d}`).join('\n')}`
                      : ', and was refused nothing.')
              }
            }
            core.info(why)

            if (pr) { core.info(`#${number}: pull request #${pr.number} is open.`); return }
            if (labels.includes('needs-decision')) { core.info(`#${number}: stopped and asked.`); return }
            if (issue.state === 'CLOSED') { core.info(`#${number}: closed, nothing to review.`); return }

            core.setOutput('why', why)
            core.setOutput('stopped_early', 'true')
            core.warning(`#${number}: no pull request, no needs-decision, still open. ${why}`)

      # Turns whatever the run left (branch, commit, or edits) into a PR labelled as
      # salvaged, since the action's clean-up discards an unpushed branch. Opened with
      # the PAT so CI runs. Fails only when there is nothing to salvage.
      - name: Salvage what it left, or fail
        if: always() && steps.deliver.outputs.stopped_early == 'true'
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}
          QUIET_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_PAT: ${{ secrets.CLAUDE_WORKFLOW_TOKEN != '' }}
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ steps.deliver.outputs.title }}
          WHY: ${{ steps.deliver.outputs.why }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          fail() {
            # GITHUB_TOKEN so the comment does not wake another run.
            GH_TOKEN="$QUIET_TOKEN" gh issue comment "$NUMBER" --body "$(printf '%s\n\n%s\n\n%s' \
              "This run ended without a pull request and without asking anything, and left nothing to salvage — no branch, no commit, no edited file. The issue stays queued and will be offered again; the run itself is marked failed so it is not mistaken for work that landed." \
              "$WHY" \
              "Run: $RUN_URL")" \
              || echo "::warning::could not comment on #$NUMBER"
            echo "::error::#$NUMBER: $1"
            exit 1
          }

          [ -n "$BRANCH" ] || fail "the action made no branch, so there is nothing to salvage. $WHY"
          # git's error is discarded because fail() reports it on the issue.
          git checkout -q "$BRANCH" 2>/dev/null || fail "branch $BRANCH is not in this checkout"

          if [ -n "$(git status --porcelain)" ]; then
            git -c user.name='claude[salvage]' -c user.email='noreply@anthropic.com' \
              add -A
            git -c user.name='claude[salvage]' -c user.email='noreply@anthropic.com' \
              commit -q -m "Salvage what a run on #$NUMBER had changed when it stopped

          The agent edited these files and returned without committing them.
          They have not been through the suite; CI on the pull request is the
          first test they get."
            echo "committed the working tree"
          fi

          ahead=$(git rev-list --count origin/main..HEAD)
          [ "$ahead" -gt 0 ] || fail "branch $BRANCH has no commits beyond main. $WHY"

          # origin's URL carries the action's token.
          git push -q -u origin HEAD
          echo "pushed $ahead commit(s) on $BRANCH"

          existing=$(gh pr list --head "$BRANCH" --state open --json number,body --jq '.[0] // empty')
          if [ -n "$existing" ]; then
            # Without `Closes #N` the issue never closes and the board never sees the PR.
            num=$(jq -r .number <<<"$existing")
            if ! jq -r .body <<<"$existing" | grep -qiE "^(closes|fixes|resolves) #$NUMBER\b"; then
              gh pr edit "$num" --body "$(printf 'Closes #%s\n\n%s' "$NUMBER" "$(jq -r .body <<<"$existing")")"
              echo "::notice::#$num was open for #$NUMBER but did not say so; added Closes #$NUMBER"
            fi
            exit 0
          fi

          body=$(printf '%s\n\n%s\n\n%s\n\n%s' \
            "Closes #$NUMBER" \
            "**Salvaged, not finished.** The run that made this stopped before opening a pull request, so the workflow opened one with what it had pushed, committed or left in the working tree. The agent did not run the suite on this state; the checks below are its first test. Read its last comment on the issue for what it thought was left." \
            "$WHY" \
            "Run: $RUN_URL")
          gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$body"
          echo "::notice::opened a pull request from $BRANCH for #$NUMBER"

          if [ "$HAS_PAT" != 'true' ]; then
            echo "::warning::opened with GITHUB_TOKEN, so CI will not run on it until someone pushes to the branch"
          fi

      - name: Stop marking it in progress
        if: always() && github.event.issue.number && !github.event.issue.pull_request
        env:
          # GITHUB_TOKEN, as above.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          # Warned: a label left on shows a run that is no longer going.
          gh issue edit "$NUMBER" --remove-label claude-working \
            || echo "::warning::could not clear claude-working on #$NUMBER; the board will show it as still running"
