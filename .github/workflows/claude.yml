# Hand an issue to Claude Code, get a pull request back.
#
# Say `@claude` in an issue, an issue comment, or a review comment on a PR, and
# this runs Claude Code against the repository with that thread as its brief.
# It reads CLAUDE.md first, so it works to this project's conventions -- the
# silence rule, British English, prose commits, proving a test bites -- rather
# than generic ones.
#
# It opens a branch and a pull request. It does not merge, and it cannot: the
# review is the point. See docs/CONTRIBUTING-AI.md for the whole loop.
#
# ---------------------------------------------------------------------------
# Setup, once. Requires ONE secret, and no Anthropic API billing:
#
#   1. On your machine:            claude setup-token
#      That opens a browser, authorises against your Claude subscription, and
#      prints a long-lived token. Pro and Max plans can do this; usage counts
#      against the plan you already pay for rather than API credits.
#
#   2. Paste it into:              Settings -> Secrets and variables -> Actions
#      as CLAUDE_CODE_OAUTH_TOKEN
#
#   3. Allow Actions to open PRs:  Settings -> Actions -> General ->
#      "Allow GitHub Actions to create and approve pull requests"
#
# Never paste that token into an issue, a commit, or a chat. It is a
# credential for your Claude account.
# ---------------------------------------------------------------------------

name: Claude

on:
  issues:
    types: [opened, assigned, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# Two issues worked at once would race on the same branch namespace, and more
# to the point would burn subscription usage in parallel for no benefit.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # A new issue is picked up on its own. Everything else still needs asking.
    #
    # `author_association` is the cheap half of the guard: OWNER for you, NONE
    # for a stranger, so a spam issue on a public repository does not even
    # start a runner. The action then does the real check -- it refuses anyone
    # without write access, on every event type -- but that refusal costs a
    # minute of Actions time and this costs nothing.
    #
    # `no-ai` keeps an issue off. Some issues are notes to self.
    if: |
      !contains(github.event.issue.labels.*.name, 'no-ai') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
               github.event.issue.author_association || github.event.comment.author_association) &&
      (
        (github.event_name == 'issues' && github.event.action == 'opened') ||
        github.event.label.name == 'claude' ||
        contains(github.event.comment.body, '@claude') ||
        contains(github.event.review.body, '@claude') ||
        contains(github.event.issue.body, '@claude') ||
        contains(github.event.issue.title, '@claude')
      )
    runs-on: ubuntu-latest

    # Who can set this off, now that the repository is public.
    #
    # The action itself requires the triggering user to have **write access**,
    # checked on issues, comments and reviews, so a stranger writing @claude on
    # an issue gets nothing. That check is the protection -- the `if:` above
    # only decides whether a run starts, not who is allowed to start one.
    #
    # Two inputs switch it off and neither is set here: `allowed_bots`, which
    # skips the permission check entirely for anything matching (a `*` there
    # lets any GitHub App on the internet trigger this), and
    # `allowed_non_write_users`. Do not add either without reading
    # https://github.com/anthropics/claude-code-action/blob/main/docs/security.md
    #
    # Issue text from anyone is still untrusted input being read by an agent
    # with a checkout. That is the residual risk of this arrangement, and the
    # reason it opens pull requests rather than pushing to main.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@v5
        with:
          # The full history, so it can read why a line is the way it is.
          # Most of the reasoning in this repository lives in commit messages.
          fetch-depth: 0

      # Claude needs to be able to run the suite before claiming a fix works,
      # and the suite needs the toolchain. Without these it can only reason
      # about the code, which for the bugs this project gets is not enough.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libudev-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # The board is moved by the workflow, not by Claude.
      #
      # Asking the agent to run `gh issue edit` was the wrong mechanism. It is
      # an instruction competing with the actual task for attention, it is
      # skipped silently when it loses, and a board that is only sometimes
      # right is worse than one nobody expects to be right at all. These steps
      # always run, in order, whatever happened inside.
      - name: Mark it in progress
        if: github.event.issue.number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit ${{ github.event.issue.number }} \
            --add-label claude-working \
            --remove-label needs-decision \
            --remove-label in-review || true

      # Appended, not replaced. `--system-prompt-file` would discard Claude
      # Code's own defaults along with the GitHub context this action installs,
      # and the symptom would be an agent that works but cannot see the issue
      # it was called about.
      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Ticked-off progress in the issue thread, so a long run is legible
          # rather than a spinner.
          track_progress: true
          claude_args: |
            --allowed-tools "Bash(pnpm:*),Bash(cargo:*),Bash(node:*),Bash(git:*),Bash(tools/:*),Bash(python3:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh pr edit:*)"
            --append-system-prompt-file .github/claude-instructions.md

      # `always()`, because the interesting case is the run that failed or was
      # cancelled: leaving claude-working on an issue nobody is working on is
      # exactly the stale label that makes a board untrustworthy.
      - name: Stop marking it in progress
        if: always() && github.event.issue.number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue edit ${{ github.event.issue.number }} --remove-label claude-working || true
