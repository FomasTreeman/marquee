# Hand an issue to Claude Code, get a pull request back.
#
# Say `@claude` in an issue, an issue comment, or a review comment on a PR, and
# this runs Claude Code against the repository with that thread as its brief.
# It reads CLAUDE.md first, so it works to this project's conventions -- the
# silence rule, British English, prose commits, proving a test bites -- rather
# than generic ones.
#
# It opens a branch and a pull request. It does not merge, and it cannot: the
# review is the point. See docs/CONTRIBUTING-AI.md for the whole loop.
#
# ---------------------------------------------------------------------------
# **Starting an issue that already carries the `claude` label.**
#
# Comment `@claude` on it, or take the label off and put it back.
#
# The trigger is the label *event*, not the label's presence, and the two look
# identical on the issue. So an issue that was labelled before this workflow
# reached its current shape -- or whose run failed, or was cancelled -- keeps a
# `claude` label that will never start anything again, and reads exactly like
# one that is queued. Four issues sat like that when the label handover landed.
#
# Reading the presence instead is not the fix; that was the old behaviour and
# it raced triage.yml on every newly opened issue, which is the bug the label
# event exists to close. But it does mean a `claude` label on its own is not
# evidence that anything is coming, and nothing on the issue says so.
# ---------------------------------------------------------------------------
#
# ---------------------------------------------------------------------------
# Setup, once. Requires ONE secret, and no Anthropic API billing:
#
#   1. On your machine:            claude setup-token
#      That opens a browser, authorises against your Claude subscription, and
#      prints a long-lived token. Pro and Max plans can do this; usage counts
#      against the plan you already pay for rather than API credits.
#
#   2. Paste it into:              Settings -> Secrets and variables -> Actions
#      as CLAUDE_CODE_OAUTH_TOKEN
#
#   3. Allow Actions to open PRs:  Settings -> Actions -> General ->
#      "Allow GitHub Actions to create and approve pull requests"
#
# Never paste that token into an issue, a commit, or a chat. It is a
# credential for your Claude account.
#
# ---------------------------------------------------------------------------
# Optional, and only needed for changes under `.github/workflows/`.
#
# GitHub refuses to let GITHUB_TOKEN write a workflow file, whatever is in the
# `permissions:` block below -- there is no `workflows: write` to grant. The
# push fails with "refusing to allow a GitHub App to create or update workflow
# ... without workflows permission", which reads like a bug in the action and
# is not one. What happened in practice is worse than a failure: the run gave
# up on the pull request and left its findings as a comment, so a correct fix
# to this very file arrived as prose for somebody to retype.
#
# A personal access token lifts it. The step below takes CLAUDE_WORKFLOW_TOKEN
# if it exists and GITHUB_TOKEN otherwise.
#
# It wants a **fine-grained** token as CLAUDE_WORKFLOW_TOKEN, scoped to this
# repository alone:
#
#     Contents          read and write
#     Pull requests     read and write
#     Issues            read and write
#     Workflows         read and write     <- the one that matters here
#     Actions           read               <- so it can see why a run failed
#
# PROJECT_TOKEN used to sit in that chain and no longer does. It is the board's
# classic token, scoped to `project` alone -- board.yml's header specifies that
# and token-check.yml asserts it, checking that the token *cannot* reach the
# repository and warning when it can. So the better it was scoped the less of
# this it could do, and being first in the chain it displaced the GITHUB_TOKEN
# fallback that would have worked. A token that fails is not a fallback.
#
# Nothing is lost by dropping it. Even a classic token wide enough to work here
# would need `repo` as well as `workflow` -- `workflow` alone cannot push -- and
# `repo` reaches every repository the account can see, while `project` reaches
# every board. That is a wide reach to hand a run whose brief is issue text
# written by anyone. A fine-grained token stops at this repository.
#
# Actions stays read either way: write would let `gh workflow run release.yml`
# cut a release, and nothing here needs to start a run.
#
# With none of them set everything below behaves exactly as before.
#
# Two things change when it is set, both wanted: pull requests and comments
# come from your account rather than github-actions[bot], and pushes made with
# it do trigger CI, which GITHUB_TOKEN deliberately does not.
# ---------------------------------------------------------------------------

name: Claude

on:
  issues:
    types: [opened, assigned, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# Two issues worked at once would race on the same branch namespace, and more
# to the point would burn subscription usage in parallel for no benefit.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # An issue is picked up when it carries the `claude` label. triage.yml
    # applies that from the template's dropdown, so a new issue still starts on
    # its own -- but through one workflow rather than two.
    #
    # This used to wake on `issues: opened` as well, which raced triage.yml on
    # the same event and beat it. The `no-ai` test below reads the labels in
    # the event payload, and at open time those are only what the template
    # applied, so the label triage was about to write was never visible and
    # "Me -- do not touch it" bought nothing. Waiting for the label event means
    # the labels are settled by the time they are read.
    #
    # `author_association` is the cheap half of the guard: OWNER for you, NONE
    # for a stranger, so a spam issue on a public repository does not even
    # start a runner. The action then does the real check -- it refuses anyone
    # without write access, on every event type -- but that refusal costs a
    # minute of Actions time and this costs nothing.
    #
    # `review.author_association` is in that list because a `pull_request_review`
    # payload carries neither `issue` nor `comment`. Without it both sides
    # resolved to the empty string, the membership test failed, and the
    # `@claude` in a review body two lines down could never start anything --
    # invisibly, because a job filtered out by `if:` leaves nothing in the
    # Actions tab to notice.
    #
    # `no-ai` keeps an issue off. Some issues are notes to self.
    if: |
      !contains(github.event.issue.labels.*.name, 'no-ai') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
               github.event.issue.author_association ||
               github.event.comment.author_association ||
               github.event.review.author_association) &&
      (
        github.event.label.name == 'claude' ||
        contains(github.event.comment.body, '@claude') ||
        contains(github.event.review.body, '@claude') ||
        contains(github.event.issue.body, '@claude') ||
        contains(github.event.issue.title, '@claude')
      )
    runs-on: ubuntu-latest
    # Long enough for a real fix with a test, short enough that a run
    # which has stopped making progress stops spending subscription
    # usage on it.
    timeout-minutes: 30

    # Who can set this off, now that the repository is public.
    #
    # The action itself requires the triggering user to have **write access**,
    # checked on issues, comments and reviews, so a stranger writing @claude on
    # an issue gets nothing. That check is the protection -- the `if:` above
    # only decides whether a run starts, not who is allowed to start one.
    #
    # Two inputs switch it off and neither is set here: `allowed_bots`, which
    # skips the permission check entirely for anything matching (a `*` there
    # lets any GitHub App on the internet trigger this), and
    # `allowed_non_write_users`. Do not add either without reading
    # https://github.com/anthropics/claude-code-action/blob/main/docs/security.md
    #
    # Issue text from anyone is still untrusted input being read by an agent
    # with a checkout. That is the residual risk of this arrangement, and the
    # reason it opens pull requests rather than pushing to main.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history, so it can read why a line is the way it is.
          # Most of the reasoning in this repository lives in commit messages.
          fetch-depth: 0

      # Claude needs to be able to run the suite before claiming a fix works,
      # and the suite needs the toolchain. Without these it can only reason
      # about the code, which for the bugs this project gets is not enough.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9

      # After pnpm: `cache: pnpm` asks pnpm where its store is, so the other
      # order caches nothing and says nothing about it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libudev-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # The run owns exactly one label: "I am working on this".
      #
      # It is the only piece of state nothing else can know -- whether this
      # process is still going -- so it is set here and cleared here. Every
      # other label and the card itself belong to board.yml, which reads what
      # is true rather than being told.
      #
      # Not PROJECT_TOKEN. That is a classic token scoped to `project` and
      # nothing else -- board.yml's header says so and token-check.yml actively
      # asserts it cannot reach the repository -- so the better it was scoped,
      # the more reliably this label write was refused. `|| true` then ate the
      # refusal, the card never showed In Progress, and the GITHUB_TOKEN
      # fallback that would have worked was never reached because the first
      # entry in the chain was set.
      - name: Mark it in progress
        if: github.event.issue.number
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          # Not fatal -- a label is not worth losing the run over -- but not
          # silent either. The board reads labels, so a failure here is a card
          # that quietly stops matching what is happening.
          gh issue edit "$NUMBER" --add-label claude-working --remove-label needs-decision \
            || echo "::warning::could not set claude-working on #$NUMBER; the board will show it as untouched"

      # Appended, not replaced. `--system-prompt-file` would discard Claude
      # Code's own defaults along with the GitHub context this action installs,
      # and the symptom would be an agent that works but cannot see the issue
      # it was called about.
      #
      # `gh run` and `gh workflow` are read-only subcommands, deliberately
      # named one at a time rather than as `gh run:*`. Fixing a workflow is
      # mostly reading the run that failed -- which step, how long it sat
      # there, what it printed -- and without these the agent can only reason
      # about the YAML, which is how #1 got a diagnosis of Windows being slow
      # with no measurement behind it.
      #
      # Not here, on purpose: `gh run rerun`, `gh run cancel` and
      # `gh workflow run`, which spend runner time on the agent's own
      # judgement -- and `gh workflow run release.yml` cuts a release. The
      # `permissions:` block above grants `actions: read` and not write, so
      # they would fail anyway; naming them would only make the failure
      # confusing. A CI fix is tested by opening the pull request and letting
      # CI run on it, which is the loop this repository already has.
      #
      # `gh pr create` is here because without it the whole loop stops one step
      # short. `.github/claude-instructions.md` says the pull request is the
      # deliverable and a comment describing one is not -- and then the tool
      # list did not let the agent open one. Issue #17 is what that looks like:
      # fifteen minutes of work, a pushed branch, and a "Create PR" link for
      # somebody to click. The instructions were not being ignored; they were
      # impossible to follow.
      #
      # `gh api` is absent. It is the one entry that could POST or DELETE
      # anything the token is allowed to, and everything else here is a read or
      # a narrowly named write. Run logs carry per-line timestamps, so step
      # timings can be had without it.
      - uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1.0.210
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # CLAUDE_WORKFLOW_TOKEN if it is set, GITHUB_TOKEN otherwise, which
          # is the whole of the previous behaviour. See the header for what the
          # PAT buys and why the board's token is not an alternative.
          github_token: ${{ secrets.CLAUDE_WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}
          # Ticked-off progress in the issue thread, so a long run is legible
          # rather than a spinner.
          track_progress: true
          claude_args: |
            --allowed-tools "Bash(cd:*),Bash(pnpm:*),Bash(cargo:*),Bash(node:*),Bash(git:*),Bash(tools/:*),Bash(python3:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr edit:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh run list:*),Bash(gh run view:*),Bash(gh workflow list:*),Bash(gh workflow view:*)"
            --append-system-prompt-file .github/claude-instructions.md

      # `always()`, because the interesting case is the run that failed or was
      # cancelled: an issue left marked in progress with nobody working on it
      # is exactly the stale state that stops a board being believed.
      #
      # board.yml then decides where the card actually goes, on the labels and
      # pull requests that exist once this has finished.
      # A run that delivered nothing should not report success.
      #
      # This is the whole complaint: #76 worked for sixteen minutes, hit
      # thirteen permission denials, stopped on "Running the full test suite
      # and clippy now", left "Open PR" unticked -- and the job went green.
      # Being refused a tool is not an error, so `is_error` was false and
      # nothing anywhere said the work had not landed. Four issues went stale
      # that way before anyone noticed there were no pull requests.
      #
      # The contract is the one claude-instructions.md already states: a run
      # ends with a pull request to review, or with a question and
      # `needs-decision`, or with the issue closed because there was nothing to
      # do. Anything else is a run that stopped early, and it says so here.
      - name: Did it deliver?
        if: always() && github.event.issue.number
        env:
          NUMBER: ${{ github.event.issue.number }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.CLAUDE_WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo
            const number = Number(process.env.NUMBER)

            const q = await github.graphql(
              `query($owner: String!, $repo: String!, $number: Int!) {
                 repository(owner: $owner, name: $repo) {
                   issue(number: $number) {
                     state
                     labels(first: 50) { nodes { name } }
                     timelineItems(last: 50, itemTypes: [CROSS_REFERENCED_EVENT, CONNECTED_EVENT]) {
                       nodes {
                         ... on CrossReferencedEvent { source { ... on PullRequest { number state } } }
                         ... on ConnectedEvent { subject { ... on PullRequest { number state } } }
                       }
                     }
                   }
                 }
               }`, { owner, repo, number })

            const issue = q.repository.issue
            const labels = issue.labels.nodes.map((l) => l.name)
            const pr = issue.timelineItems.nodes
              .map((n) => n.source || n.subject)
              .find((s) => s && s.number && s.state === 'OPEN')

            if (pr) return core.info(`#${number}: pull request #${pr.number} is open.`)
            if (labels.includes('needs-decision')) return core.info(`#${number}: stopped and asked.`)
            if (issue.state === 'CLOSED') return core.info(`#${number}: closed, nothing to review.`)

            // Not fatal to the issue, but the run is not a success. The board
            // counts this as an attempt; three of them is a question for a
            // person, which is board.mjs's rule and not this step's to apply.
            await github.rest.issues.createComment({
              owner, repo, issue_number: number,
              body:
                "This run ended without a pull request and without asking anything, "
                + "so it stopped early rather than finishing. Nothing here is lost — "
                + "the issue stays queued and will be picked up again — but the run "
                + "itself is marked failed so it is not mistaken for work that landed.\n\n"
                + "The usual cause is a tool the run needed and was not granted; "
                + "`tools/check-agent-tools.py` checks for that case.",
            })
            core.setFailed(
              `#${number}: no pull request, no needs-decision, still open. `
              + 'The run stopped early.')

      - name: Stop marking it in progress
        if: always() && github.event.issue.number
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          # Louder than the one above: a label left on says a run is still
          # going when it is not, which is the stale state that stops a board
          # being believed at all.
          gh issue edit "$NUMBER" --remove-label claude-working \
            || echo "::warning::could not clear claude-working on #$NUMBER; the board will show it as still running"
