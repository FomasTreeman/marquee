# A small merge queue, since GitHub's is unavailable on personal repositories.
# When main moves, the oldest auto-merge pull request that is behind gets
# updated, CI runs and auto-merge completes it. A person enabling auto-merge
# stays the review gate. One at a time, so each merge does not invalidate CI
# on the rest. Uses CLAUDE_WORKFLOW_TOKEN: a GITHUB_TOKEN commit gets no CI.

name: Merge queue

on:
  push:
    branches: [main]
  pull_request:
    types: [auto_merge_enabled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # One updater at a time, matching one update at a time.
  group: merge-queue
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bring the next queued pull request up to date
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_WORKFLOW_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Set when auto-merge was enabled; empty on a push to main.
          ONLY: ${{ github.event.pull_request.number }}
          # `number` is oldest first; `clicked` is the order auto-merge was
          # enabled in. Set with the MERGE_QUEUE_ORDER repository variable.
          ORDER: ${{ vars.MERGE_QUEUE_ORDER || 'number' }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::CLAUDE_WORKFLOW_TOKEN is not set. An update made with GITHUB_TOKEN gets no CI run and can never merge, so nothing was updated."
            exit 1
          fi

          # mergeStateStatus reads UNKNOWN for a few seconds after main moves.
          state_of() {
            for _ in 1 2 3 4 5 6; do
              s=$(gh pr view "$1" --json mergeStateStatus --jq .mergeStateStatus)
              [ "$s" != "UNKNOWN" ] && { echo "$s"; return; }
              sleep 5
            done
            echo "$s"
          }

          if [ -n "$ONLY" ]; then
            queued="$ONLY"
          else
            case "$ORDER" in
              number)  key='.number' ;;
              clicked) key='.autoMergeRequest.enabledAt' ;;
              *)
                echo "::error::MERGE_QUEUE_ORDER is '$ORDER'; it must be 'number' or 'clicked'. Nothing was updated."
                exit 1
                ;;
            esac
            queued=$(gh pr list --state open --limit 100 \
              --json number,autoMergeRequest \
              --jq "[.[] | select(.autoMergeRequest != null)] | sort_by($key) | .[].number")
          fi
          [ -n "$queued" ] || { echo "Nothing is waiting on auto-merge."; exit 0; }

          for n in $queued; do
            state=$(state_of "$n")
            case "$state" in
              BEHIND)
                gh pr update-branch "$n"
                echo "::notice::Brought #$n up to date; CI runs on it next, then auto-merge."
                exit 0
                ;;
              DIRTY)
                # Hand conflicts to the agent, once per head commit so a
                # failed resolution is not retried every time main moves.
                head=$(gh pr view "$n" --json headRefOid --jq .headRefOid)
                # jq rather than `grep -q`: grep closes the pipe early, gh dies
                # of SIGPIPE and pipefail made a present marker read as absent.
                if [ "$(gh pr view "$n" --json comments --jq "any(.comments[].body; contains(\"<!-- conflict:$head -->\"))")" = true ]; then
                  echo "::warning::#$n conflicts with main and was already handed over at $head; skipping."
                  continue
                fi
                printf '%s\n\n%s\n' \
                  "<!-- conflict:$head -->" \
                  '@claude this branch conflicts with `main` and is waiting to merge. Merge `main` into it, resolve the conflicts keeping the intent of both sides, run `pnpm test`, and push to this branch. Do not open another pull request.' \
                  > conflict.md
                gh pr comment "$n" --body-file conflict.md
                echo "::warning::#$n conflicts with main; handed to the agent."
                ;;
              *)
                echo "#$n is $state; nothing to do for it."
                ;;
            esac
          done
