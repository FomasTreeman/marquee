# Keep an issue's labels in step with the pull request that will close it.
#
# The board reads labels, and until now nothing set `in-review` -- Claude was
# asked to, which is not a mechanism, it is a hope. An issue whose fix was
# written, pushed and waiting to be read still showed as untouched.
#
# The link is `Closes #n` in the pull request body. GitHub turns that into
# `closingIssuesReferences`, which is what this reads, so an issue only gets
# labelled when the pull request genuinely closes it.

name: Pull request labels

on:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const pr = context.payload.pull_request;

            // Which issues does this pull request say it closes?
            const q = await github.graphql(`
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 10) { nodes { number } }
                  }
                }
              }`, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                number: pr.number,
              });

            const issues = q.repository.pullRequest
              .closingIssuesReferences.nodes.map(n => n.number);

            if (!issues.length) {
              // Not a failure. Plenty of pull requests fix nothing on the
              // board -- this one might be one of them.
              core.info(`#${pr.number} closes no issues; nothing to label.`);
              return;
            }

            // Merging closes the issue, and a closed issue is Done -- the
            // label would be stale the moment it landed. Closing without
            // merging sends it back to whatever its other labels say.
            const opening = context.payload.action !== 'closed';

            for (const number of issues) {
              if (opening) {
                await github.rest.issues.addLabels({
                  ...context.repo, issue_number: number, labels: ['in-review'],
                });
              } else {
                await github.rest.issues.removeLabel({
                  ...context.repo, issue_number: number, name: 'in-review',
                }).catch(() => {
                  // Already gone. Removing a label that is not there is a 404,
                  // and it means the state is what we wanted anyway.
                });
              }
              // Whoever is working on it, it is not Claude any more.
              await github.rest.issues.removeLabel({
                ...context.repo, issue_number: number, name: 'claude-working',
              }).catch(() => {});
              core.info(`#${number} -> ${opening ? 'in-review' : 'not in review'}`);
            }
