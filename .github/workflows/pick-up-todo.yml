# Hands the oldest waiting Todo issue to the agent with an `@claude` comment.
# An issue in Todo has already used its only trigger, so without this it waits
# forever. Bounded: one issue per sweep, an hour's cooldown per issue, and a
# grace period after labelling inside `shouldPickUp` (board.mjs), which
# otherwise started a second run on an issue whose first had not yet begun.

name: Pick up Todo

on:
  # Driven by runs finishing, so the queue drains as work completes. The
  # hourly cron is a fallback: GitHub delivered it at gaps of up to six hours.
  workflow_run:
    workflows: [Claude]
    types: [completed]
  schedule:
    # Offset from board.yml's :17 so the board has settled before this reads it.
    - cron: '43 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: pick-up-todo
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_WORKFLOW_TOKEN != '' }}
        with:
          # Must be the PAT: a GITHUB_TOKEN comment would trigger nothing.
          github-token: ${{ secrets.CLAUDE_WORKFLOW_TOKEN || github.token }}
          script: |
            const { factsFor, shouldPickUp } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/board.mjs`)
            const { owner, repo } = context.repo
            const MARKER = '<!-- handed-over -->'

            if (process.env.HAS_TOKEN !== 'true') {
              core.setFailed(
                'CLAUDE_WORKFLOW_TOKEN is not set, so a comment posted here would start '
                + 'nothing — GitHub suppresses events caused by GITHUB_TOKEN. Refusing to '
                + 'post a handover that cannot hand anything over.')
              return
            }

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            })
            // Drop pull requests; oldest first.
            const issues = open.filter((i) => !i.pull_request).sort((a, b) => a.number - b.number)

            for (const issue of issues) {
              const facts = await factsFor(github, owner, repo, issue.number)
              if (!facts) continue

            // Last offer: our marker or anyone's `@claude`, since either starts
            // a run. Counting only the marker once caused a double start.
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: issue.number, per_page: 100,
              })
              const last = comments
                .filter((c) => (c.body || '').includes(MARKER) || /@claude\b/.test(c.body || ''))
                .pop()
              const hours = last
                ? (Date.now() - new Date(last.created_at)) / 3600000
                : undefined

              if (!shouldPickUp(facts, hours)) continue

              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: [
                  MARKER,
                  '@claude this has been sitting in Todo with nothing working on it, so'
                  + ' picking it up now.',
                  '',
                  'Read `CLAUDE.md` and `.github/claude-instructions.md` first. Put'
                  + ' `Closes #' + issue.number + '` in the pull request body.',
                  '',
                  '**Open the pull request yourself** — a comment describing one is not the'
                  + ' deliverable. If the fix needs a decision that is not yours, say what you'
                  + ' found, ask the one question you need answered, label it `needs-decision`'
                  + ' and stop. Guessing costs more to review than stopping does.',
                ].join('\n'),
              })
              core.notice(
                `Handed #${issue.number} to Claude` +
                (hours === undefined ? ' (first offer)' : ` (last offered ${hours.toFixed(1)}h ago)`))
              // One per sweep.
              return
            }

            core.info('Nothing in Todo is waiting on an agent.')
