# Reconciles each issue's label and Projects card from what is true about it,
# in one run, since events caused by GITHUB_TOKEN trigger no further workflows.
# Rules live in .github/scripts/board.mjs, tested by board.test.mjs.
# PROJECT_TOKEN is a classic PAT with `project` scope only, as user-owned boards
# have no fine-grained permission. Everything else uses GITHUB_TOKEN.

name: Board

on:
  issues:
    types: [opened, closed, reopened, labeled, unlabeled, assigned]
  pull_request_target:
    types: [opened, closed, reopened, ready_for_review, converted_to_draft, synchronize]
  # CI finishing changes whether a pull request is ready to read.
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    # Safety net: corrects anything the event-driven paths missed.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  # Serialised so two runs cannot race on the same card.
  group: board
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No `ref:`. pull_request_target runs with PROJECT_TOKEN for fork PRs, so
      # checking out the PR head would run unreviewed fork code beside that token.
      # The script reads everything it needs through the API.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # Cannot reach the board; the script uses PROJECT_TOKEN for that.
          github-token: ${{ github.token }}
          script: |
            const { loadProject, projectCaller, reconcile } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/board.mjs`)

            const owner = context.repo.owner
            const repo = context.repo.repo
            const projectApi = projectCaller(process.env.PROJECT_TOKEN)
            const project = await loadProject(
              projectApi, owner, Number(process.env.PROJECT_NUMBER))

            // A pull request is not a card; it stands for the issues it closes.
            async function issuesFor(prNumber) {
              const q = await github.graphql(
                `query($owner: String!, $repo: String!, $n: Int!) {
                   repository(owner: $owner, name: $repo) {
                     pullRequest(number: $n) {
                       closingIssuesReferences(first: 10) { nodes { number } }
                     }
                   }
                 }`, { owner, repo, n: prNumber })
              return q.repository.pullRequest.closingIssuesReferences.nodes.map((i) => i.number)
            }

            let numbers = []
            if (context.eventName === 'issues') {
              numbers = [context.payload.issue.number]
            } else if (context.eventName === 'pull_request_target') {
              numbers = await issuesFor(context.payload.pull_request.number)
            } else if (context.eventName === 'workflow_run') {
              const prs = context.payload.workflow_run.pull_requests || []
              for (const pr of prs) numbers.push(...await issuesFor(pr.number))
              // A workflow_run from a fork carries no pull requests, so sweep.
              if (!prs.length) numbers = null
            } else {
              numbers = null   // scheduled or dispatched: everything open
            }

            if (numbers === null) {
              const open = await github.paginate(github.rest.issues.listForRepo, {
                owner, repo, state: 'open', per_page: 100,
              })
              numbers = open.filter((i) => !i.pull_request).map((i) => i.number)
              core.info(`sweeping ${numbers.length} open issues`)
            }

            for (const number of [...new Set(numbers)]) {
              await reconcile({ github, project, projectApi, core, owner, repo, number })
            }
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER || 8 }}
