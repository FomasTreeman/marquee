# Merge a pull request, get a release. Nobody types a version number.
#
# This used to be two workflows and a hand-typed tag, which produced exactly
# the failure it was meant to prevent: a tag pushed by hand, a version in
# tauri.conf.json that disagreed with it, and a build that refused. Worse, the
# two could not be joined up, because **a tag pushed with GITHUB_TOKEN does not
# trigger another workflow** -- GitHub blocks that to stop workflows looping.
# So the tag landed and the build never ran, which is why the only release on
# the repository had nothing in it but source archives.
#
# It is one workflow now. Deciding the version, tagging, building and
# publishing happen in a single run, so there is nothing to trigger and nothing
# to keep in step.
#
# ---------------------------------------------------------------------------
# What decides the version: the labels on the pull request that was merged.
#
#     breaking                -> major     1.4.2 -> 2.0.0
#     enhancement | feature   -> minor     1.4.2 -> 1.5.0
#     anything else           -> patch     1.4.2 -> 1.4.3
#     no-release              -> nothing happens
#
# There is no decision left for a person to get wrong. Override it by running
# the workflow by hand and choosing a bump.
# ---------------------------------------------------------------------------

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Override the version bump'
        required: false
        default: auto
        type: choice
        options: [auto, patch, minor, major]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      skip: ${{ steps.plan.outputs.skip }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Tags are needed to work out where we are, and a shallow checkout
          # has none. Losing this does not fail the build -- it quietly makes
          # every release start from the version in the file, which is exactly
          # the collision the newest-tag floor exists to prevent.
          fetch-depth: 0

      - name: Work out what to release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          msg=$(git log -1 --pretty=%s)

          # The pull request this commit came from, if any. A direct push to
          # main has none, and gets a patch.
          pr=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
                 --jq '.[0] // empty' 2>/dev/null || true)
          # Not `${pr:-{}}`. Bash reads that as ${pr:-{} followed by a literal
          # }, so an empty pr gives a valid {} and a real one gives the whole
          # JSON with a stray brace stuck on the end -- which parses fine until
          # the first time a commit actually has a pull request behind it, and
          # then fails with "Unmatched '}'" halfway through the object.
          [ -n "$pr" ] || pr='{}'
          labels=$(echo "$pr" | jq -r '(.labels // []) | map(.name) | join(" ")')
          title=$(echo "$pr" | jq -r '.title // ""')
          number=$(echo "$pr" | jq -r '.number // ""')
          echo "pull request: ${number:-none} — ${title:-n/a}"
          echo "labels: ${labels:-none}"

          if [[ " $labels " == *" no-release "* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Labelled no-release."; exit 0
          fi

          bump=patch
          if [[ " $labels " == *" breaking "* ]]; then bump=major
          elif [[ " $labels " == *" enhancement "* || " $labels " == *" feature "* ]]; then bump=minor
          fi
          if [ -n "${OVERRIDE:-}" ] && [ "${OVERRIDE}" != "auto" ]; then
            bump="$OVERRIDE"
            echo "Overridden to $bump"
          fi

          # Start from whichever is higher: the version in the file, or the
          # newest tag. That makes it impossible to compute a tag that already
          # exists, however the repository got into its current state -- which
          # is the trap that produced v0.2.0 sitting above a 0.0.1 config.
          from_file=$(node -p "require('./src-tauri/tauri.conf.json').version")
          from_tags=$(git tag -l 'v*' | sed 's/^v//' \
                        | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
                        | sort -V | tail -1 || true)
          base=$(printf '%s\n%s\n' "$from_file" "${from_tags:-0.0.0}" | sort -V | tail -1)
          echo "config $from_file, newest tag ${from_tags:-none}, starting from $base"

          IFS=. read -r major minor patch <<< "$base"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="$major.$minor.$patch"
          echo "Releasing $base -> $next ($bump)"

          # The notes people see in the update prompt. The pull request title
          # is a real sentence about what changed; "see the commit log" is not.
          if [ -n "$number" ]; then
            notes="$title (#$number)"
          else
            notes="$msg"
          fi
          {
            echo "version=$next"
            echo "skip=false"
            echo "notes=$notes"
          } >> "$GITHUB_OUTPUT"


  # Prove the signing key works before spending nine minutes finding out it
  # does not.
  #
  # The whole matrix built for 5-9 minutes each and then died at the very last
  # step on "incorrect updater private key password: Wrong password for that
  # key" -- the bundler signs after it has built everything. This does the same
  # decode against a scratch file in about a minute, so a key problem costs a
  # minute and says so plainly.
  key:
    needs: decide
    if: needs.decide.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      # After pnpm: `cache: pnpm` asks pnpm where its store is.
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: The signing key and its password agree
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set in the 'release' environment."
            exit 1
          fi
          echo probe > probe.txt
          if ! pnpm tauri signer sign probe.txt >/dev/null 2>signer.log; then
            echo "::error::The signing key could not be decoded. $(tail -1 signer.log)"
            echo
            echo "A key generated with no password needs the password secret to be the"
            echo "EMPTY STRING -- not absent, and not a placeholder. Unset fails with"
            echo "'Device not configured' because the CLI tries to prompt; a non-empty"
            echo "value fails with 'Wrong password for that key'. Deleting the secret"
            echo "gives an empty string, which is what works."
            echo "See docs/UPDATES.md."
            exit 1
          fi
          echo "Signing key OK."

  build:
    needs: [decide, key]
    if: needs.decide.outputs.skip != 'true'
    strategy:
      fail-fast: false
      # One at a time, and this is not a preference.
      #
      # Every job writes `latest.json` -- the file the updater actually reads --
      # by downloading it, adding its own platform and uploading it again. Run
      # four of those at once and it is a read-modify-write race: whoever
      # finishes last wins and the others' entries are gone.
      #
      # v0.2.9 shipped that way. The release page looked perfect, the .exe and
      # its signature were both attached, and `latest.json` had eight platform
      # entries instead of eleven -- none of them Windows. Every Windows
      # install was told it was up to date, indefinitely, with the update
      # sitting right there.
      #
      # Four targets in sequence costs about fifteen minutes rather than five.
      # A release nobody receives costs more.
      max-parallel: 1
      matrix:
        include:
          # Apple silicon and Intel are separate bundles; the updater picks by
          # target triple, so shipping one strands half the Macs.
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    # The signing key lives here rather than in repository secrets, so no other
    # workflow -- including one added by a pull request -- can reach it. Safe
    # if the environment does not exist yet: a job with an environment still
    # sees repository secrets.
    #
    # If the environment does exist, its "deployment branches and tags" rule
    # must allow **main**, not a `v*` tag pattern. GitHub checks that against
    # the ref the workflow is running on -- a push to main -- not against the
    # tag this job checks out below. A tag pattern here fails the whole release
    # with "Branch main is not allowed to deploy", which reads like a
    # permissions problem and is not one. Allowing main still blocks pull
    # requests, which run on refs/pull/<n>/merge. See docs/UPDATES.md.
    environment: release

    steps:
      - uses: actions/checkout@v5
        with:
          # The exact commit that triggered this, so all four targets build
          # identical source however busy main is.
          ref: ${{ github.sha }}

      # Defender scans every file cargo writes, and cargo writes tens of
      # thousands of them. It is the single biggest cause of a Windows job
      # sitting apparently idle for minutes at a time.
      #
      # Tolerant of failure on purpose: this is a speed-up, not a
      # requirement, and a runner image that has moved Defender or dropped the
      # cmdlet should not fail the build over it.
      - name: Keep Defender out of the build directories
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "${{ github.workspace }}\src-tauri\target" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "cargo.exe" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "rustc.exe" -ErrorAction SilentlyContinue
          Write-Host "Defender exclusions applied."

      # Written into the working copy and never committed.
      #
      # An earlier version committed the bump and pushed it to main, which
      # meant the release automation needed write access to the one branch
      # that should only ever change through a reviewed pull request -- every
      # protection worth having would have had to carve out an exception for
      # it. The tag and the release are the record of what shipped; the number
      # sitting in main is not, and `decide` reads the newest tag anyway.
      - name: Set the version for this build
        shell: bash
        run: |
          set -euo pipefail
          next='${{ needs.decide.outputs.version }}'
          node -e '
            const fs = require("fs");
            const next = process.argv[1];
            for (const f of ["src-tauri/tauri.conf.json", "package.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = next;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
          ' "$next"
          # Node rather than sed or perl: this same step runs on four runner
          # images including Windows, and the one tool guaranteed on all of
          # them is the one the frontend already needs.
          node -e '
            const fs = require("fs");
            const f = "src-tauri/Cargo.toml";
            const before = fs.readFileSync(f, "utf8");
            const after = before.replace(/^version = ".*"$/m, `version = "${process.argv[1]}"`);
            if (after === before) throw new Error("no version line in " + f);
            fs.writeFileSync(f, after);
          ' "$next"
          grep -m1 '^version' src-tauri/Cargo.toml

      - name: Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: pnpm/action-setup@v4
        with: { version: 9 }

      # After pnpm: `cache: pnpm` asks pnpm where its store is.
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}
          tagName: v${{ needs.decide.outputs.version }}
          releaseName: Marquee ${{ needs.decide.outputs.version }}
          releaseBody: |
            ${{ needs.decide.outputs.notes }}

            Installed copies will offer this version shortly after their next
            launch. Or ask now: Settings → Updates → Check for updates.
          # Published, not a draft. The human gate moved earlier: the change
          # was reviewed as a pull request, which is a better place to catch
          # something than a release page. A draft here would also mean the
          # updater never sees it, since /releases/latest ignores drafts --
          # which is the shape of the bug this file just replaced.
          releaseDraft: false
          prerelease: false
          # Writes latest.json, which is the file the updater actually reads.
          # Without it the release is just installers nobody's app will find.
          includeUpdaterJson: true

  # The release page can look perfect while the one file that matters is
  # incomplete. Nothing noticed that until a Windows user was told they were up
  # to date for the third day running, so it is checked here instead.
  verify:
    needs: [decide, build]
    if: needs.decide.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Every platform is in the manifest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          gh release download "v$VERSION" --repo "${{ github.repository }}" \
            --pattern latest.json --output latest.json
          node -e '
            const m = JSON.parse(require("fs").readFileSync("latest.json", "utf8"));
            const want = [
              "darwin-aarch64", "darwin-x86_64",
              "linux-x86_64",
              "windows-x86_64",
            ];
            const have = Object.keys(m.platforms || {});
            const missing = want.filter((p) => !have.includes(p));
            const unsigned = have.filter((p) => !m.platforms[p].signature);
            console.log("version  ", m.version);
            console.log("platforms", have.join(", "));
            if (missing.length) {
              console.log(`::error::latest.json is missing ${missing.join(", ")} — ` +
                          `those platforms will never be offered this update`);
              process.exit(1);
            }
            if (unsigned.length) {
              console.log(`::error::unsigned in latest.json: ${unsigned.join(", ")}`);
              process.exit(1);
            }
            console.log("Every platform present and signed.");
          '
