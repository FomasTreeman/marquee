# On merge to main: pick the version from the PR's labels (breaking -> major,
# enhancement/feature -> minor, else patch, no-release -> skip), wait for green CI,
# build and sign every platform into a draft, verify latest.json, then publish.
# One workflow, because a tag pushed with GITHUB_TOKEN would not trigger a build.
# Run it by hand to override the bump.

name: Release

on:
  push:
    branches: [main]
    # A commit touching only these paths ships nothing a user runs, so no release.
    # A commit that also touches code still releases.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
      - 'design/**'
      - 'tools/**'
      - LICENSE
  workflow_dispatch:
    inputs:
      bump:
        description: 'Override the version bump'
        required: false
        default: auto
        type: choice
        options: [auto, patch, minor, major]

permissions:
  contents: write
  pull-requests: read
  # Read only: the `ci` job reads CI runs and starts nothing.
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      skip: ${{ steps.plan.outputs.skip }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags are needed for the version floor; a shallow clone silently has none.
          fetch-depth: 0

      - name: Work out what to release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          msg=$(git log -1 --pretty=%s)

          # The PR this commit came from; a direct push has none and gets a patch.
          pr=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
                 --jq '.[0] // empty' 2>/dev/null || true)
          # Not `${pr:-{}}`: bash parses that as ${pr:-{} plus a stray }.
          [ -n "$pr" ] || pr='{}'
          labels=$(echo "$pr" | jq -r '(.labels // []) | map(.name) | join(" ")')
          title=$(echo "$pr" | jq -r '.title // ""')
          number=$(echo "$pr" | jq -r '.number // ""')
          echo "pull request: ${number:-none} — ${title:-n/a}"
          echo "labels: ${labels:-none}"

          if [[ " $labels " == *" no-release "* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Labelled no-release."; exit 0
          fi

          bump=patch
          if [[ " $labels " == *" breaking "* ]]; then bump=major
          elif [[ " $labels " == *" enhancement "* || " $labels " == *" feature "* ]]; then bump=minor
          fi
          if [ -n "${OVERRIDE:-}" ] && [ "${OVERRIDE}" != "auto" ]; then
            bump="$OVERRIDE"
            echo "Overridden to $bump"
          fi

          # Start from the higher of the file version and the newest tag, so a tag
          # that already exists can never be computed. No tags is fine, hence || true.
          from_file=$(node -p "require('./src-tauri/tauri.conf.json').version")
          from_tags=$(git tag -l 'v*' | sed 's/^v//' \
                        | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
                        | sort -V | tail -1 || true)
          base=$(printf '%s\n%s\n' "$from_file" "${from_tags:-0.0.0}" | sort -V | tail -1)
          echo "config $from_file, newest tag ${from_tags:-none}, starting from $base"

          IFS=. read -r major minor patch <<< "$base"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="$major.$minor.$patch"
          echo "Releasing $base -> $next ($bump)"

          # The PR title is the release note shown in the update prompt.
          if [ -n "$number" ]; then
            notes="$title (#$number)"
          else
            notes="$msg"
          fi
          {
            echo "version=$next"
            echo "skip=false"
            echo "notes=$notes"
          } >> "$GITHUB_OUTPUT"

      # A run that died before publishing leaves a draft, which has no tag, so the
      # next run computes the same version and would add to that stale draft. Delete
      # it. Only drafts are deleted; a published release always has its tag.
      - name: Clear a draft left behind by an earlier attempt
        if: steps.plan.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          # `gh release view` fails when there is no release, which is the usual case.
          state=$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$state" = "true" ]; then
            # No `--cleanup-tag`: a draft has no tag, and gh fails the job looking for it.
            gh release delete "v$VERSION" --yes
            echo "::warning::Deleted a leftover draft v$VERSION from an earlier attempt. Rebuilding it."
          else
            echo "No draft v$VERSION to clear (found: $state)."
          fi


  # The bundler runs no tests, and two PRs green alone can break main together, so
  # nothing is released until CI is green on this exact commit.
  ci:
    needs: decide
    if: needs.decide.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # Longer than the step's own 30-minute deadline, so its error message wins.
    timeout-minutes: 35
    outputs:
      green: ${{ steps.wait.outputs.green }}
    steps:
      - name: CI is green on this commit
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # CI takes minutes; half an hour means a stuck queue.
          deadline=$(( $(date +%s) + 1800 ))

          while :; do
            # An API failure is warned about, not mistaken for "CI has not started".
            if ! run=$(gh api \
                    "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=1" \
                    --jq '.workflow_runs[0] // empty' 2>err.log); then
              echo "::warning::could not read CI runs for $SHA: $(tail -1 err.log)"
              run=''
            fi
            # Not `${run:-{}}`, for the same reason as in `decide`.
            [ -n "$run" ] || run='{}'

            status=$(echo "$run" | jq -r '.status // "none"')
            conclusion=$(echo "$run" | jq -r '.conclusion // ""')
            url=$(echo "$run" | jq -r '.html_url // ""')

            if [ "$status" = "completed" ]; then
              case "$conclusion" in
                success)
                  echo "green=true" >> "$GITHUB_OUTPUT"
                  echo "CI is green on $SHA."
                  exit 0
                  ;;
                cancelled)
                  # CI cancels itself on a newer push; if this is no longer the tip,
                  # the newer commit carries the release, so stop cleanly.
                  tip=$(gh api "repos/$GH_REPO/commits/main" --jq '.sha')
                  if [ "$tip" != "$SHA" ]; then
                    echo "green=false" >> "$GITHUB_OUTPUT"
                    echo "::notice::CI on $SHA was cancelled by a newer push. ${tip:0:7} will carry the release."
                    exit 0
                  fi
                  echo "::error::CI on $SHA was cancelled, and it is still the tip of main. Nothing is released from a commit nothing has checked. $url"
                  exit 1
                  ;;
                *)
                  echo "::error::CI is $conclusion on $SHA. Nothing is released from a commit that does not pass. $url"
                  exit 1
                  ;;
              esac
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Waited thirty minutes and CI has not finished on $SHA (last seen: $status). $url"
              exit 1
            fi

            echo "CI is $status on $SHA; waiting."
            sleep 20
          done

  # Signing happens at the end of a 5 to 9 minute build, so check the key and its
  # password first and fail in a minute.
  key:
    needs: decide
    if: needs.decide.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 9 }
      # After pnpm: `cache: pnpm` asks pnpm where its store is.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: The signing key and its password agree
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set in the 'release' environment."
            exit 1
          fi
          echo probe > probe.txt
          if ! pnpm tauri signer sign probe.txt >/dev/null 2>signer.log; then
            echo "::error::The signing key could not be decoded. $(tail -1 signer.log)"
            echo
            echo "A key generated with no password needs the password secret to be the"
            echo "EMPTY STRING -- not absent, and not a placeholder. Unset fails with"
            echo "'Device not configured' because the CLI tries to prompt; a non-empty"
            echo "value fails with 'Wrong password for that key'. Deleting the secret"
            echo "gives an empty string, which is what works."
            echo "See docs/UPDATES.md."
            exit 1
          fi
          echo "Signing key OK."

  build:
    needs: [decide, key, ci]
    if: needs.decide.outputs.skip != 'true' && needs.ci.outputs.green == 'true'
    strategy:
      fail-fast: false
      # Serial on purpose: each job read-modify-writes `latest.json`, so parallel jobs
      # drop each other's platforms (v0.2.9 shipped without Windows). Costs about
      # 25 minutes against 12 in parallel.
      max-parallel: 1
      matrix:
        include:
          # The updater picks by target triple, so both Macs need a bundle.
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    # Bounded so a wedged runner cannot hold `concurrency: release` for six hours.
    timeout-minutes: 45

    # The signing key is in the `release` environment so no other workflow, including
    # one from a PR, can read it. Its deployment rule must allow branch `main`, not a
    # `v*` tag: GitHub checks the triggering ref. See docs/UPDATES.md.
    environment: release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The triggering commit, so all four targets build the same source.
          ref: ${{ github.sha }}

      # Defender scanning cargo output stalls Windows builds. Only a speed-up, so a
      # runner image without the cmdlet must not fail the build.
      - name: Keep Defender out of the build directories
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "${{ github.workspace }}\src-tauri\target" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "cargo.exe" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "rustc.exe" -ErrorAction SilentlyContinue
          Write-Host "Defender exclusions applied."

      # Never committed, so release automation needs no push access to main. The tag
      # is the record of what shipped.
      - name: Set the version for this build
        shell: bash
        run: |
          set -euo pipefail
          next='${{ needs.decide.outputs.version }}'
          node -e '
            const fs = require("fs");
            const next = process.argv[1];
            for (const f of ["src-tauri/tauri.conf.json", "package.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = next;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
          ' "$next"
          # Node rather than sed or perl: it is on all four runner images.
          node -e '
            const fs = require("fs");
            const f = "src-tauri/Cargo.toml";
            const before = fs.readFileSync(f, "utf8");
            const after = before.replace(/^version = ".*"$/m, `version = "${process.argv[1]}"`);
            if (after === before) throw new Error("no version line in " + f);
            fs.writeFileSync(f, after);
          ' "$next"
          grep -m1 '^version' src-tauri/Cargo.toml

      - name: Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libudev-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 9 }

      # After pnpm: `cache: pnpm` asks pnpm where its store is.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 20, cache: pnpm }

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}
          tagName: v${{ needs.decide.outputs.version }}
          releaseName: Marquee ${{ needs.decide.outputs.version }}
          releaseBody: |
            ${{ needs.decide.outputs.notes }}

            Installed copies will offer this version shortly after their next
            launch. Or ask now: Settings → Updates → Check for updates.
          # Draft until verify publishes it, or `/releases/latest` serves a manifest
          # missing the platforms still building.
          releaseDraft: true
          prerelease: false
          # Writes latest.json, the file the updater reads. (`includeUpdaterJson` was
          # the v0.4 name and is ignored by v1.)
          uploadUpdaterJson: true

  # The release page can look complete while latest.json is not, so check it.
  verify:
    needs: [decide, build]
    if: needs.decide.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every platform is in the manifest, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          gh release download "v$VERSION" --repo "${{ github.repository }}" \
            --pattern latest.json --output latest.json
          node -e '
            const m = JSON.parse(require("fs").readFileSync("latest.json", "utf8"));
            const want = [
              "darwin-aarch64", "darwin-x86_64",
              "linux-x86_64",
              "windows-x86_64",
            ];
            const have = Object.keys(m.platforms || {});
            const missing = want.filter((p) => !have.includes(p));
            const unsigned = have.filter((p) => !m.platforms[p].signature);
            console.log("version  ", m.version);
            console.log("platforms", have.join(", "));
            if (missing.length) {
              console.log(`::error::latest.json is missing ${missing.join(", ")} — ` +
                          `those platforms will never be offered this update`);
              process.exit(1);
            }
            if (unsigned.length) {
              console.log(`::error::unsigned in latest.json: ${unsigned.join(", ")}`);
              process.exit(1);
            }
            console.log("Every platform present and signed.");
          '

      - name: Publish it
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          # Publishing is what makes the release visible to installed copies.
          gh release edit "v$VERSION" --repo "${{ github.repository }}" --draft=false
          echo "v$VERSION is live."

