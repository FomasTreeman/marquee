# Route an issue the moment it is filed.
#
# The template asks who should fix it; this turns that answer into the label
# the rest of the automation runs on. Without it somebody has to remember to
# add a label by hand, and an issue arriving with neither sits in a queue
# nobody is working through -- which is how a to-do list becomes a graveyard.
#
# Separate from board.yml because it runs once, at the start, and answers a
# different question: not "where does this belong" but "whose is it".
#
# ---------------------------------------------------------------------------
# This is the only thing that decides whether Claude picks an issue up, and
# the only place that asks who filed it. Everything downstream -- the label
# event, the Todo sweep, the `@claude` handover comment -- trusts the label,
# so the gate on strangers has to be here or it is nowhere.
#
# It did not used to be the only thing. claude.yml also woke on `issues: opened`, and its
# opt-out read `github.event.issue.labels` -- the labels in the *event
# payload*, which at open time hold only what the template applied. The label
# this workflow was in the middle of writing was not among them, both
# workflows raced on the same event, and the race was not close: the third
# option in the dropdown, "Me -- do not touch it", did nothing at all.
#
# So the handover is a label event now, which needs one thing to be true.
# **GitHub will not run a workflow off an event GITHUB_TOKEN caused**, so a
# `claude` label written by the workflow's own token wakes nothing. Writing it
# with CLAUDE_WORKFLOW_TOKEN does. Without that secret the label is still
# correct and nothing starts, so the fallback below says so on the issue
# rather than leaving somebody waiting on a run that was never going to
# happen.
# ---------------------------------------------------------------------------

name: Triage

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HANDOVER: ${{ secrets.CLAUDE_WORKFLOW_TOKEN != '' }}
        with:
          # The label write is the handover, so it goes through the token that
          # can trigger a workflow. The comment below could use either.
          github-token: ${{ secrets.CLAUDE_WORKFLOW_TOKEN || github.token }}
          script: |
            const body = context.payload.issue.body || ''
            const labels = context.payload.issue.labels.map((l) => l.name)

            // Already routed -- by hand, or by the template's own labels.
            if (labels.includes('claude') || labels.includes('no-ai')) {
              core.info('already routed')
              return
            }

            // Who filed it decides, before what they asked for. The repository
            // is public and an agent run is subscription usage, so the answer
            // from a stranger is `no-ai` whatever the dropdown says -- the
            // template offered "Claude" to anyone, and an issue that took it
            // up landed in Todo, where pick-up-todo.yml hands it over with the
            // owner's token. Anyone with a GitHub account could start a run.
            //
            // From someone with write access, the agent: an issue the owner
            // types on a phone with a title and two lines is work they want
            // done, and `no-ai` on it was a queue nobody was working through.
            // "Me" in the dropdown is honoured for them too.
            //
            // claude.yml no longer runs on `opened` (it double-fired with
            // `labeled`), so the label this puts on is the only thing that
            // starts anything.
            const said = (body.match(/Who should fix this[\s\S]{0,120}?\b(Claude|Me)\b/i) || [])[1] || ''
            const ours = ['OWNER', 'MEMBER', 'COLLABORATOR']
              .includes(context.payload.issue.author_association)
            const askedForClaude = /^claude$/i.test(said) || /@claude\b/i.test(body)
            const wantsClaude = ours && !/^me$/i.test(said)
            const label = wantsClaude ? 'claude' : 'no-ai'

            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.payload.issue.number,
              labels: [label],
            })
            core.info(`#${context.payload.issue.number} -> ${label}`)

            // Say so whenever the answer was not the one asked for. Silently
            // deciding that nobody will work on something is worse than
            // asking, and a stranger who ticked "Claude" deserves to know the
            // agent does not take requests from the internet.
            if (!wantsClaude) {
              const why = askedForClaude
                ? 'Thanks. The agent here only takes work handed over by a maintainer, '
                  + 'so this is labelled `no-ai` for now; a maintainer will swap that '
                  + 'for `claude` if it is something for it to do.'
                : 'Filed without saying who should fix it, so it is labelled '
                  + '`no-ai` and will wait for a person. Swap that for `claude` '
                  + 'to hand it over.'
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.payload.issue.number,
                body: why,
              })
              return
            }

            // Labelled for Claude, but with a token that cannot wake anything.
            // The label is right and the run will never start, which is the
            // exact shape of failure this repository is worst at seeing.
            if (process.env.HANDOVER !== 'true') {
              core.warning(
                'Labelled `claude`, but CLAUDE_WORKFLOW_TOKEN is not set, so the label '
                + 'event will not start a run -- GitHub suppresses events caused by '
                + 'GITHUB_TOKEN. Comment @claude on the issue to start it by hand.')
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.payload.issue.number,
                body:
                  'Labelled `claude`, but nothing has started: without ' +
                  '`CLAUDE_WORKFLOW_TOKEN` in the repository secrets this label ' +
                  'cannot trigger a workflow, because GitHub suppresses events ' +
                  'caused by `GITHUB_TOKEN`. Comment `@claude` here to start it, ' +
                  'or add the secret — see the header of ' +
                  '`.github/workflows/claude.yml`.',
              })
            }
