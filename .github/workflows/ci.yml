# CI on all three platforms.
#
# docs/PLAN.md §3 names three webview engines as the defining risk of the
# stack, and the mitigation is that divergence is found in week one rather than
# month four. That only works if every commit is built everywhere, so this runs
# on all three from the start rather than "before release".
#
# This catches the compile-time half of that risk. The runtime half needs the
# screenshot diff in §3, which is not built yet. Releases are a separate
# workflow -- see release.yml and docs/UPDATES.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Defender scans every file cargo writes, and cargo writes tens of
      # thousands of them. It is the single biggest cause of a Windows job
      # sitting apparently idle for minutes at a time.
      #
      # Tolerant of failure on purpose: this is a speed-up, not a
      # requirement, and a runner image that has moved Defender or dropped the
      # cmdlet should not fail the build over it.
      - name: Keep Defender out of the build directories
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "${{ github.workspace }}\src-tauri\target" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "cargo.exe" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "rustc.exe" -ErrorAction SilentlyContinue
          Write-Host "Defender exclusions applied."

      # WebKitGTK and its build dependencies. Nothing else in the matrix needs
      # anything: WebView2 ships with Windows, WKWebView with macOS.
      - name: Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libudev-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9

      # After pnpm, not before. `cache: pnpm` asks pnpm where its store is,
      # so with the old order it found nothing and cached nothing -- silently,
      # which is the only kind of missing cache there is.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Design tokens are in step with their source
        shell: bash
        run: |
          python3 tools/build-tokens.py
          git diff --exit-code src/css/tokens.css \
            || { echo "::error::tokens.css is stale. Run: pnpm tokens"; exit 1; }

      # A discarded failure with no log call and no comment saying why. Cheap,
      # and it runs before the slow steps so it fails fast.
      - name: No unexplained discarded failures
        shell: bash
        run: tools/check-silence.sh

      # A schema-invalid workflow does not fail loudly -- it fails as a run
      # named after the file path, in zero seconds, which reads like a rename
      # rather than a break. Releases stopped for three merges before anyone
      # noticed.
      - name: Workflows GitHub will accept
        shell: bash
        run: python3 tools/check-workflows.py

      - run: pnpm exec tsc --noEmit

      - name: Frontend tests
        run: pnpm exec vitest run

      - run: pnpm exec vite build

      # Warnings are errors here but not locally: a warning that blocks the
      # inner loop gets silenced, and a warning nothing checks accumulates.
      #
      # `--lib` because every test is in the library. Plain `cargo test` also
      # built the binary and a second test harness around it -- two whole-
      # application links, on Windows the slowest thing in the run by a wide
      # margin -- to find out that main.rs is six lines and holds no tests.
      # It counted 128 tests before and counts the same 128 now. clippy still
      # compiles main.rs, and release.yml links the real binary on all four
      # targets on every push to main, in the profile that actually ships, so
      # this was never the only proof that the thing links.
      #
      # opt-level 0 applies to our crate alone: the `package."*"` override in
      # Cargo.toml pins the dependencies at 3 regardless, so this changes no
      # dependency fingerprint and leaves the rust-cache valid. Tests that
      # finish in under a second do not need optimising first.
      - name: Rust
        working-directory: src-tauri
        env:
          RUSTFLAGS: -D warnings
          CARGO_PROFILE_TEST_OPT_LEVEL: 0
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --lib
