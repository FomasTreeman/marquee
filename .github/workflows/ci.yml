# Builds and tests every commit on Linux, Windows and macOS, so divergence
# between the three webview engines shows up at once (docs/PLAN.md §3).
# Releases are separate: see release.yml and docs/UPDATES.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only. Every workflow declares its own permissions per job or workflow;
# the repository default is only a ceiling, and a request above it is ignored.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A wedged Windows link once had the six-hour default to sit in.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Defender scanning cargo output is the main cause of slow Windows jobs.
      # A speed-up only, so a runner without the cmdlet must not fail the build.
      - name: Keep Defender out of the build directories
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "${{ github.workspace }}\src-tauri\target" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "cargo.exe" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "rustc.exe" -ErrorAction SilentlyContinue
          Write-Host "Defender exclusions applied."

      # WebKitGTK. Windows and macOS ship their webviews.
      - name: Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libudev-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      # After pnpm: `cache: pnpm` asks pnpm for its store path, and before
      # setup it silently cached nothing.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # ---------------------------------------------------------------------
      # Platform-independent checks, so they run on Linux only. They stay in
      # this job because the ruleset requires the `build (...)` job names; a
      # separate job would quietly stop blocking merges.
      # ---------------------------------------------------------------------
      - name: Design tokens are in step with their source
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          python3 tools/build-tokens.py
          git diff --exit-code src/css/tokens.css \
            || { echo "::error::tokens.css is stale. Run: pnpm tokens"; exit 1; }

      - name: No unexplained discarded failures
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: tools/check-silence.sh

      - name: Board rules
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: node .github/scripts/board.test.mjs

      # An invalid workflow fails as a zero-second run named after its path,
      # which once stopped releases for three merges unnoticed.
      - name: Workflows GitHub will accept
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: python3 tools/check-workflows.py

      # A refused tool does not fail the agent; it reports success having
      # done nothing.
      - name: The agent can run what it is told to run
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: python3 tools/check-agent-tools.py

      - if: matrix.os == 'ubuntu-latest'
        run: pnpm exec tsc --noEmit

      - name: Frontend tests
        if: matrix.os == 'ubuntu-latest'
        run: pnpm exec vitest run

      # Needed on every OS: `generate_context!` embeds dist/, and without it
      # the crate fails to compile with a misleading proc-macro error.
      - run: pnpm exec vite build

      # Warnings are errors in CI only, so they do not block the inner loop.
      # `--lib` because every test is in the library, and linking the binary
      # twice was the slowest part on Windows; release.yml proves it links.
      # opt-level 0 affects only our crate, so the dependency cache stays valid.
      - name: Rust
        working-directory: src-tauri
        env:
          RUSTFLAGS: -D warnings
          CARGO_PROFILE_TEST_OPT_LEVEL: 0
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --lib
