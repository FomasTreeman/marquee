# Prove the tokens have what they need, before something quietly half-works.
#
# Actions -> Token check -> Run workflow.
#
# A token missing one permission does not fail loudly. The board moves cards
# but never touches a label; the agent opens a pull request but cannot comment;
# a workflow file edit is rejected with a message nobody reads. Each looks like
# a different bug, and none of them looks like a permissions problem.
#
# So this tries each operation for real, on this repository, and says which
# permission is missing when one fails. Read-only except for one label added
# and immediately removed on an issue that exists for the purpose.

name: Token check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const owner = context.repo.owner, repo = context.repo.repo
            const results = []
            const try_ = async (what, need, fn) => {
              try { await fn(); results.push(['ok  ', what, '']) }
              catch (e) { results.push(['MISS', what, `${need} — ${e.message.split('\n')[0]}`]) }
            }

            core.info('PROJECT_TOKEN (classic, `project` scope)')
            await try_('read the project', 'a CLASSIC token with `project` scope — fine-grained tokens cannot see a user-owned board', async () => {
              const q = await github.graphql(
                `query($o: String!, $n: Int!) { user(login: $o) { projectV2(number: $n) { id } } }`,
                { o: owner, n: Number(process.env.PROJECT_NUMBER || 8) })
              if (!q.user?.projectV2) throw new Error('project not visible to this token')
            })
            await try_('list issues', 'Repository permissions -> Issues: Read', () =>
              github.rest.issues.listForRepo({ owner, repo, per_page: 1 }))
            await try_('read a pull request', 'Repository permissions -> Pull requests: Read', () =>
              github.rest.pulls.list({ owner, repo, state: 'all', per_page: 1 }))
            // Checked against GITHUB_TOKEN's own permissions, not the classic
            // token: labels are written by the workflow itself now, so the
            // board token needs no repository access whatsoever.
            await try_('write a label (as the workflow, not PROJECT_TOKEN)',
                       'the `issues: write` line in the workflow permissions block', async () => {
              const [issue] = (await github.rest.issues.listForRepo({
                owner, repo, state: 'all', per_page: 1 })).data
              if (!issue) return
              await github.rest.issues.addLabels({
                owner, repo, issue_number: issue.number, labels: ['token-check'] })
              await github.rest.issues.removeLabel({
                owner, repo, issue_number: issue.number, name: 'token-check' })
            })

            core.summary.addHeading('PROJECT_TOKEN', 3)
            core.summary.addTable([
              [{ data: '', header: true }, { data: 'can it', header: true }, { data: 'if not', header: true }],
              ...results.map(([s, w, n]) => [s, w, n]),
            ])
            await core.summary.write()
            for (const [s, w, n] of results) core.info(`  ${s} ${w} ${n}`)
            if (results.some(([s]) => s === 'MISS')) {
              core.setFailed('PROJECT_TOKEN is missing a permission — see the table above.')
            }

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.CLAUDE_WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner, repo = context.repo.repo
            const results = []
            const try_ = async (what, need, fn) => {
              try { await fn(); results.push(['ok  ', what, '']) }
              catch (e) { results.push(['MISS', what, `${need} — ${e.message.split('\n')[0]}`]) }
            }

            if (!process.env.HAS_WORKFLOW_TOKEN) {
              core.warning(
                'CLAUDE_WORKFLOW_TOKEN is not set. Everything falls back to GITHUB_TOKEN, ' +
                'which works for most of it but cannot trigger other workflows and cannot ' +
                'change files under .github/workflows.')
            }

            core.info('CLAUDE_WORKFLOW_TOKEN')
            await try_('read the repository', 'Repository permissions -> Contents: Read', () =>
              github.rest.repos.get({ owner, repo }))
            await try_('read workflow runs', 'Repository permissions -> Actions: Read', () =>
              github.rest.actions.listWorkflowRunsForRepo({ owner, repo, per_page: 1 }))
            await try_('read pull requests', 'Repository permissions -> Pull requests: Read and write', () =>
              github.rest.pulls.list({ owner, repo, state: 'all', per_page: 1 }))
            await try_('read issues', 'Repository permissions -> Issues: Read and write', () =>
              github.rest.issues.listForRepo({ owner, repo, per_page: 1 }))
            // The one that is easiest to miss: a commit touching a file under
            // .github/workflows is rejected without the Workflows permission,
            // and the agent has written workflow files more than once.
            await try_('see workflow files', 'Repository permissions -> Workflows: Read and write', () =>
              github.rest.repos.getContent({ owner, repo, path: '.github/workflows/ci.yml' }))

            core.summary.addHeading('CLAUDE_WORKFLOW_TOKEN', 3)
            core.summary.addTable([
              [{ data: '', header: true }, { data: 'can it', header: true }, { data: 'if not', header: true }],
              ...results.map(([s, w, n]) => [s, w, n]),
            ])
            await core.summary.write()
            for (const [s, w, n] of results) core.info(`  ${s} ${w} ${n}`)
            if (results.some(([s]) => s === 'MISS')) {
              core.setFailed('CLAUDE_WORKFLOW_TOKEN is missing a permission — see the table above.')
            }
        env:
          HAS_WORKFLOW_TOKEN: ${{ secrets.CLAUDE_WORKFLOW_TOKEN != '' }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER || 8 }}
