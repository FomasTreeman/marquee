# Checks each token can do its own job and carries no more than it needs, and
# warns before a token expires, since a missing permission or an expired token
# fails silently. Weekly and on demand (Actions -> Token check -> Run workflow).
# Read-only apart from one label added and removed.

name: Token check

on:
  schedule:
    # Monday morning, before Dependabot's pull requests arrive.
    - cron: '13 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  project-token:
    name: PROJECT_TOKEN moves cards, and nothing else
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER || 8 }}
        with:
          # No github-token, so nothing passes on the workflow's own token.
          script: |
            const token = process.env.PROJECT_TOKEN
            if (!token) {
              core.setFailed('PROJECT_TOKEN is not set. It must be a CLASSIC token with the '
                + '`project` scope — a user-owned board has no fine-grained equivalent.')
              return
            }

            const gql = async (query, variables) => {
              const res = await fetch('https://api.github.com/graphql', {
                method: 'POST',
                headers: { authorization: `bearer ${token}`, 'content-type': 'application/json' },
                body: JSON.stringify({ query, variables }),
              })
              const body = await res.json()
              if (body.errors?.length) throw new Error(body.errors.map((e) => e.message).join('; '))
              return body.data
            }

            const rows = []
            const try_ = async (what, need, fn) => {
              try { await fn(); rows.push(['ok', what, '']) }
              catch (e) { rows.push(['MISSING', what, `${need} — ${e.message.split('\n')[0]}`]) }
            }

            // The expiry is in a response header; nothing announces it otherwise.
            const expiry = async () => {
              const res = await fetch('https://api.github.com/rate_limit',
                { headers: { authorization: `bearer ${token}` } })
              const when = res.headers.get('github-authentication-token-expiration')
              if (!when) { rows.push(['ok', 'it does not expire', 'no expiry set on this token']); return }
              const days = Math.floor((new Date(when) - Date.now()) / 86400000)
              rows.push([days <= 14 ? 'MISSING' : 'note', `it expires in ${days} days`, when])
              if (days <= 14) {
                core.warning(`PROJECT_TOKEN expires in ${days} days (${when}). `
                  + 'When it does the board stops moving and nothing says why.')
              }
            }

            let project
            await try_('see the board', 'a CLASSIC token with the `project` scope', async () => {
              const q = await gql(
                `query($o: String!, $n: Int!) {
                   user(login: $o) { projectV2(number: $n) {
                     id field(name: "Status") {
                       ... on ProjectV2SingleSelectField { id options { id name } }
                     } } } }`,
                { o: context.repo.owner, n: Number(process.env.PROJECT_NUMBER) })
              project = q.user?.projectV2
              if (!project) throw new Error('the board is not visible to this token')
            })

            await try_('find the Status field', 'the board needs a Status field', async () => {
              if (!project?.field) throw new Error('no Status field on that board')
              const want = ['Todo (Human)', 'Todo', 'In Progress', 'Needs Decision', 'In Review', 'Done']
              const have = project.field.options.map((o) => o.name)
              const missing = want.filter((w) => !have.includes(w))
              if (missing.length) throw new Error(`no column named ${missing.join(', ')}`)
            })

            // It must not carry more than `project`: a classic token with `repo`
            // can write to every repository on the account. Read the scopes header,
            // since every token can read a public repository.
            const probe = await fetch('https://api.github.com/rate_limit',
              { headers: { authorization: `bearer ${token}` } })
            const scopes = (probe.headers.get('x-oauth-scopes') || '')
              .split(',').map((x) => x.trim()).filter(Boolean)
            const extra = scopes.filter((x) => !['project', 'read:project'].includes(x))
            rows.push(extra.length
              ? ['note', `it also carries ${extra.join(', ')}`,
                 'narrow it to `project` alone when convenient']
              : ['ok', `its scopes are ${scopes.join(', ') || 'unreported'}`, 'which is correct'])

            await expiry()

            core.summary.addHeading('PROJECT_TOKEN — classic, `project` scope', 3)
            core.summary.addTable([[{ data: '', header: true }, { data: 'can it', header: true },
                                    { data: 'note', header: true }], ...rows])
            await core.summary.write()
            for (const [s, w, n] of rows) core.info(`  ${s.padEnd(8)} ${w} ${n}`)
            if (rows.some(([s]) => s === 'MISSING')) core.setFailed('PROJECT_TOKEN cannot do its job.')

  workflow-token:
    name: The workflow's own token writes labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Labels use the workflow token, so PROJECT_TOKEN needs no repo access.
            const { owner, repo } = context.repo
            const rows = []
            const try_ = async (what, need, fn) => {
              try { await fn(); rows.push(['ok', what, '']) }
              catch (e) { rows.push(['MISSING', what, `${need} — ${e.message.split('\n')[0]}`]) }
            }

            await try_('read issues', 'permissions: issues: write', () =>
              github.rest.issues.listForRepo({ owner, repo, per_page: 1 }))
            await try_('read pull requests', 'permissions: pull-requests: read', () =>
              github.rest.pulls.list({ owner, repo, state: 'all', per_page: 1 }))
            await try_('write a label', 'permissions: issues: write', async () => {
              // A plain issue: labelling a pull request needs `pull-requests:
              // write`, which board.yml never uses and so falsely failed here.
              const { data } = await github.rest.issues.listForRepo({
                owner, repo, state: 'all', per_page: 20 })
              const issue = data.find((i) => !i.pull_request)
              if (!issue) { core.info('no plain issues to test against'); return }
              await github.rest.issues.addLabels({
                owner, repo, issue_number: issue.number, labels: ['token-check'] })
              await github.rest.issues.removeLabel({
                owner, repo, issue_number: issue.number, name: 'token-check' })
            })

            core.summary.addHeading("The workflow's own GITHUB_TOKEN", 3)
            core.summary.addTable([[{ data: '', header: true }, { data: 'can it', header: true },
                                    { data: 'note', header: true }], ...rows])
            await core.summary.write()
            for (const [s, w, n] of rows) core.info(`  ${s.padEnd(8)} ${w} ${n}`)
            if (rows.some(([s]) => s === 'MISSING')) core.setFailed('board.yml cannot write labels.')

  agent-token:
    name: CLAUDE_WORKFLOW_TOKEN acts as the agent
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_WORKFLOW_TOKEN != '' }}
        with:
          github-token: ${{ secrets.CLAUDE_WORKFLOW_TOKEN || github.token }}
          script: |
            const { owner, repo } = context.repo
            const rows = []
            const try_ = async (what, need, fn) => {
              try { await fn(); rows.push(['ok', what, '']) }
              catch (e) { rows.push(['MISSING', what, `${need} — ${e.message.split('\n')[0]}`]) }
            }

            if (process.env.HAS_TOKEN !== 'true') {
              core.warning('CLAUDE_WORKFLOW_TOKEN is not set, so this is checking GITHUB_TOKEN '
                + 'instead. Everything falls back to it, which mostly works — but GitHub will '
                + 'not run a workflow off an event GITHUB_TOKEN caused, so nothing cascades.')
            }

            await try_('read the repository', 'Contents: Read and write', () =>
              github.rest.repos.get({ owner, repo }))
            await try_('read workflow runs', 'Actions: Read', () =>
              github.rest.actions.listWorkflowRunsForRepo({ owner, repo, per_page: 1 }))
            await try_('read pull requests', 'Pull requests: Read and write', () =>
              github.rest.pulls.list({ owner, repo, state: 'all', per_page: 1 }))
            await try_('read issues', 'Issues: Read and write', () =>
              github.rest.issues.listForRepo({ owner, repo, per_page: 1 }))
            // Commits touching .github/workflows are refused without this.
            await try_('see workflow files', 'Workflows: Read and write', () =>
              github.rest.repos.getContent({ owner, repo, path: '.github/workflows/ci.yml' }))

            // Fine-grained tokens expire by default, so check this one too.
            if (process.env.HAS_TOKEN === 'true') {
              const res = await github.request('GET /rate_limit')
              const when = res.headers['github-authentication-token-expiration']
              if (!when) {
                rows.push(['ok', 'it does not expire', 'no expiry set on this token'])
              } else {
                const days = Math.floor((new Date(when) - Date.now()) / 86400000)
                rows.push([days <= 14 ? 'MISSING' : 'note', `it expires in ${days} days`, when])
                if (days <= 14) {
                  core.warning(`CLAUDE_WORKFLOW_TOKEN expires in ${days} days (${when}). `
                    + 'When it does, pull requests stop being opened and nothing says why.')
                }
              }
            }

            core.summary.addHeading('CLAUDE_WORKFLOW_TOKEN — fine-grained', 3)
            core.summary.addTable([[{ data: '', header: true }, { data: 'can it', header: true },
                                    { data: 'note', header: true }], ...rows])
            await core.summary.write()
            for (const [s, w, n] of rows) core.info(`  ${s.padEnd(8)} ${w} ${n}`)
            if (rows.some(([s]) => s === 'MISSING')) core.setFailed('The agent token is short a permission.')

  agent-subscription:
    name: CLAUDE_CODE_OAUTH_TOKEN is present
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        with:
          script: |
            // Presence only: the token cannot be tested without spending usage,
            // and without it every Claude workflow fails only at its last step.
            // TAURI_SIGNING_PRIVATE_KEY is checked by release.yml's `key` job.
            if (process.env.HAS_TOKEN !== 'true') {
              core.setFailed(
                'CLAUDE_CODE_OAUTH_TOKEN is not set. Every Claude workflow will start, '
                + 'install a toolchain, and fail at the last step. Generate one with '
                + '`claude setup-token` and add it under Settings -> Secrets and '
                + 'variables -> Actions. See the header of .github/workflows/claude.yml.')
              return
            }
            core.info('CLAUDE_CODE_OAUTH_TOKEN is set.')
            core.summary.addHeading('CLAUDE_CODE_OAUTH_TOKEN', 3)
            core.summary.addRaw('Present. Whether it still authorises is not testable '
              + 'without spending a run of subscription usage.')
            await core.summary.write()
