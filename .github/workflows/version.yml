# Cut a release without hand-editing anything.
#
# Actions -> Release -> Run workflow -> pick patch, minor or major.
#
# It bumps the version in tauri.conf.json and package.json together, commits
# that, and pushes a tag. The tag is what release.yml watches, so the build,
# the signing and the draft release follow on their own.
#
# This exists because the version is not decoration once an updater is live:
# every install compares its own version against the manifest, so a
# tauri.conf.json that disagrees with the tag ships an update that either never
# offers itself or offers itself forever. Editing two files and typing a tag by
# hand is three chances to get that wrong, on the one workflow where being
# wrong is visible to everybody who installed it.

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the version to increase'
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the next version
        id: next
        run: |
          set -euo pipefail
          current=$(node -p "require('./src-tauri/tauri.conf.json').version")
          IFS=. read -r major minor patch <<< "$current"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="$major.$minor.$patch"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next"       >> "$GITHUB_OUTPUT"
          echo "Releasing $current -> $next"

      - name: Refuse to reuse a tag
        run: |
          if git rev-parse "v${{ steps.next.outputs.next }}" >/dev/null 2>&1; then
            echo "::error::v${{ steps.next.outputs.next }} already exists"
            exit 1
          fi

      - name: Write the version to both files
        run: |
          set -euo pipefail
          next='${{ steps.next.outputs.next }}'
          node -e '
            const fs = require("fs");
            const next = process.argv[1];
            for (const f of ["src-tauri/tauri.conf.json", "package.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = next;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
          ' "$next"
          # Cargo.toml carries it too, and a stale one makes `marquee --version`
          # disagree with the thing the updater is comparing.
          sed -i "0,/^version = \".*\"$/s//version = \"$next\"/" src-tauri/Cargo.toml
          grep -m1 '^version' src-tauri/Cargo.toml

      - name: Keep Cargo.lock in step
        working-directory: src-tauri
        run: cargo update -p marquee --precise ${{ steps.next.outputs.next }} 2>/dev/null || cargo check --locked --quiet || cargo generate-lockfile

      - name: Commit and tag
        run: |
          set -euo pipefail
          next='${{ steps.next.outputs.next }}'
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src-tauri/tauri.conf.json package.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "Marquee $next"
          git tag "v$next"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v$next"
          echo "Tagged v$next. The build workflow takes it from here."
