# CI goes red on one of Claude's own pull requests. Claude fixes it.
#
# This was the last step in the loop that needed a person for no reason. A run
# opened a pull request, CI failed on Windows two minutes later, and the branch
# sat there until somebody noticed and typed `@claude`. Everything either side
# of it was already automatic.
#
# ---------------------------------------------------------------------------
# `workflow_run` is the privileged trigger and the one to be careful with. It
# runs from the default branch, with secrets and write access, whatever the run
# that triggered it was -- so a pull request from a fork, whose own CI run
# deliberately has no secrets at all, could otherwise reach them through here.
# Two conditions in the `if:` below close that:
#
#     head_repository.full_name == github.repository    not a fork
#     head_branch starts with claude/                   a branch only something
#                                                       with write access could
#                                                       have pushed
#
# Neither is decoration. Take either one out and this file becomes the standard
# workflow_run escalation, and it will not look any different while it is one.
#
# The other thing to know: **a workflow_run workflow only fires once it is on
# the default branch.** This file does nothing on the pull request that adds
# it. The first real proof it works is the first red Claude PR after it merges.
# ---------------------------------------------------------------------------

name: CI repair

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# Per branch, and not cancelling: a second failure arriving while a repair is
# still pushing should queue behind it, not race it to the same ref.
concurrency:
  group: ci-repair-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'claude/')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      # Read, not write. Reading the failed run is the whole job; starting one
      # is not, and `gh workflow run release.yml` cuts a release.
      actions: read

    steps:
      # Three ways this should not run, all of them cheap to check and all of
      # them expensive to get wrong -- the failure mode of an unattended loop
      # is not one bad run, it is forty.
      - name: Is this still worth doing?
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          # Through the environment rather than interpolated into the script.
          # A branch name is attacker-controlled in the general case, and
          # `${{ }}` is substituted into the shell before bash ever sees it --
          # the injection this whole file is written to avoid.
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          say() { echo "go=false" >> "$GITHUB_OUTPUT"; echo "$1"; exit 0; }

          pr=$(gh pr list --head "$BRANCH" --state open \
                 --json number,isDraft --jq '.[0] // empty')
          [ -n "$pr" ] || say "No open pull request for $BRANCH."

          number=$(echo "$pr" | jq -r .number)
          [ "$(echo "$pr" | jq -r .isDraft)" = "false" ] \
            || say "#$number is a draft, which means it is not finished yet."

          # A push that landed while CI was still running leaves this failure
          # describing code that no longer exists. Fixing it would mean fixing
          # something nobody has, and the newer run will call us back anyway.
          newest=$(gh run list --workflow CI --branch "$BRANCH" --limit 1 \
                     --json databaseId --jq '.[0].databaseId // empty')
          [ "$newest" = "$RUN_ID" ] \
            || say "Run $RUN_ID is not the newest for $BRANCH ($newest); stale."

          # Three goes, then it is a person's problem. An agent that cannot fix
          # a failure in three attempts is not going to find it on the ninth,
          # and each one costs a full run of subscription usage.
          attempts=$(gh pr view "$number" --json comments \
                       --jq '[.comments[] | select(.body | contains("<!-- ci-repair -->"))] | length')
          if [ "$attempts" -ge 3 ]; then
            gaveup=$(gh pr view "$number" --json comments \
                       --jq '[.comments[] | select(.body | contains("<!-- ci-repair-gave-up -->"))] | length')
            if [ "$gaveup" -eq 0 ]; then
              printf '%s\n\n%s\n\n%s\n\n%s\n' \
                '<!-- ci-repair-gave-up -->' \
                '**CI has failed three times here and I have stopped trying.**' \
                'Three attempts that do not fix it usually means the failure is not the one the diff is about -- a platform difference, a flake, or something that needs a decision rather than a patch. Worth a look rather than a fourth run.' \
                '`@claude` on this pull request restarts it if you disagree.' \
                > gave-up.md
              gh pr comment "$number" --body-file gave-up.md
              gh pr edit "$number" --add-label needs-decision || true
            fi
            say "#$number has had $attempts repair attempts; stopping."
          fi

          # Posted before Claude runs, not after, so a run that dies partway
          # still counts against the three. Otherwise a crash loops forever.
          printf '%s\n\n%s\n' \
            '<!-- ci-repair -->' \
            "CI failed -- repair attempt $((attempts + 1)) of 3. [Failed run]($RUN_URL)" \
            > attempt.md
          gh pr comment "$number" --body-file attempt.md

          {
            echo "go=true"
            echo "pr=$number"
            echo "attempt=$((attempts + 1))"
          } >> "$GITHUB_OUTPUT"
          echo "Repairing #$number, attempt $((attempts + 1))."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.guard.outputs.go == 'true'
        with:
          # The branch, not the failing commit: the fix has to be pushable, and
          # a detached HEAD is not.
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ secrets.CLAUDE_WORKFLOW_TOKEN || secrets.PROJECT_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: steps.guard.outputs.go == 'true'
        with:
          components: clippy, rustfmt

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: steps.guard.outputs.go == 'true'
        with:
          version: 9

      # After pnpm: `cache: pnpm` asks pnpm where its store is.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.guard.outputs.go == 'true'
        with:
          node-version: 20
          cache: pnpm

      - name: Linux dependencies
        if: steps.guard.outputs.go == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libudev-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.guard.outputs.go == 'true'
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
        if: steps.guard.outputs.go == 'true'

      - uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1.0.210
        if: steps.guard.outputs.go == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.CLAUDE_WORKFLOW_TOKEN || secrets.PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
          # Everything the run needs is spelled out here. `workflow_run` is not
          # an event the action can read a pull request out of by itself, so
          # nothing below should assume it knows which one this is.
          prompt: |
            CI failed on pull request #${{ steps.guard.outputs.pr }}, branch
            `${{ github.event.workflow_run.head_branch }}`. You are on that
            branch now. Fix it. This is attempt
            ${{ steps.guard.outputs.attempt }} of 3.

            Read `CLAUDE.md` first, and `.github/claude-instructions.md` after
            it.

            **Start from what the run actually said**, not from what the diff
            looks like it should do:

            ```bash
            gh run view ${{ github.event.workflow_run.id }} --log-failed
            ```

            Failing run: ${{ github.event.workflow_run.html_url }}

            Then:

            - **Push the fix to this branch.** A pull request is already open.
              Do not open another, and do not open one against `main`.
            - **A failure on one platform only is a finding, not a flake.**
              Windows and macOS diverge from Linux here more than anywhere
              else, and roughly a tenth of the Rust never compiles on the
              development machine at all. Do not rerun and hope.
            - **If the test is what is wrong, you may change the test** — but
              say which you concluded and why in a comment on the pull request.
              Changing a test until it passes is how a green pull request stops
              meaning anything, and it is the failure this repository is least
              able to see.
            - Run `pnpm test` and `cd src-tauri && cargo clippy --all-targets
              -- -D warnings` before you push. Pushing a guess costs another
              full CI run and one of only three attempts.
            - **If you cannot work out why it failed, or the fix needs a
              decision that is not yours, stop.** Comment on the pull request
              with what you found and the one question you need answered. A
              confident patch for the wrong problem costs more to review than
              nothing at all.
          claude_args: |
            --allowed-tools "Bash(pnpm:*),Bash(cargo:*),Bash(node:*),Bash(git:*),Bash(tools/:*),Bash(python3:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr edit:*),Bash(gh pr comment:*),Bash(gh run list:*),Bash(gh run view:*),Bash(gh workflow view:*)"
            --append-system-prompt-file .github/claude-instructions.md
