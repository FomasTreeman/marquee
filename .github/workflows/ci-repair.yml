# When CI fails on a pull request, Claude tries to fix the branch, up to three times.
#
# `workflow_run` runs from main with secrets and write access, whatever triggered it.
# The `head_repository == github.repository` check is what keeps a fork's PR from
# reaching those secrets; do not remove it. Only fires once this file is on main.

name: CI repair

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# Per branch and queued, so two repairs never push to the same ref at once.
concurrency:
  group: ci-repair-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != 'main'
    runs-on: ubuntu-latest
    outputs:
      stalled: ${{ steps.deliver.outputs.stalled }}
      attempt: ${{ steps.guard.outputs.attempt }}
# Bounded so an unattended run cannot hang indefinitely.
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write
      issues: write
      # Read only: `gh workflow run release.yml` would cut a release.
      actions: read

    steps:
      # Skip drafts, closed PRs, stale runs, and anything already tried three times.
      - name: Is this still worth doing?
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          # Via env, never `${{ }}` in the script: run metadata is attacker-controlled
          # and `${{ }}` is substituted before bash parses it.
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          say() { echo "go=false" >> "$GITHUB_OUTPUT"; echo "$1"; exit 0; }

          pr=$(gh pr list --head "$BRANCH" --state open \
                 --json number,isDraft --jq '.[0] // empty')
          [ -n "$pr" ] || say "No open pull request for $BRANCH."

          number=$(echo "$pr" | jq -r .number)
          [ "$(echo "$pr" | jq -r .isDraft)" = "false" ] \
            || say "#$number is a draft, which means it is not finished yet."

          # A newer push makes this failure stale, and its own CI run will call back.
          newest=$(gh run list --workflow CI --branch "$BRANCH" --limit 1 \
                     --json databaseId --jq '.[0].databaseId // empty')
          [ "$newest" = "$RUN_ID" ] \
            || say "Run $RUN_ID is not the newest for $BRANCH ($newest); stale."

          # Three attempts, then it is for a person.
          attempts=$(gh pr view "$number" --json comments \
                       --jq '[.comments[] | select(.body | contains("<!-- ci-repair -->"))] | length')
          if [ "$attempts" -ge 3 ]; then
            gaveup=$(gh pr view "$number" --json comments \
                       --jq '[.comments[] | select(.body | contains("<!-- ci-repair-gave-up -->"))] | length')
            if [ "$gaveup" -eq 0 ]; then
              printf '%s\n\n%s\n\n%s\n\n%s\n' \
                '<!-- ci-repair-gave-up -->' \
                '**CI has failed three times here and I have stopped trying.**' \
                'Three attempts that do not fix it usually means the failure is not the one the diff is about -- a platform difference, a flake, or something that needs a decision rather than a patch. Worth a look rather than a fourth run.' \
                '`@claude` on this pull request restarts it if you disagree.' \
                > gave-up.md
              gh pr comment "$number" --body-file gave-up.md
              # The board reads the label, so a failed label write must be visible.
              gh pr edit "$number" --add-label needs-decision \
                || echo "::warning::commented on #$number but could not label it needs-decision"
            fi
            say "#$number has had $attempts repair attempts; stopping."
          fi

          # Posted before the agent runs, so a crashed run still counts as an attempt.
          printf '%s\n\n%s\n' \
            '<!-- ci-repair -->' \
            "CI failed -- repair attempt $((attempts + 1)) of 3. [Failed run]($RUN_URL)" \
            > attempt.md
          gh pr comment "$number" --body-file attempt.md

          {
            echo "go=true"
            echo "pr=$number"
            echo "attempt=$((attempts + 1))"
            # Counted after the attempt comment, so only the agent can raise it.
            echo "comments=$(gh pr view "$number" --json comments --jq '.comments | length')"
          } >> "$GITHUB_OUTPUT"
          echo "Repairing #$number, attempt $((attempts + 1))."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.guard.outputs.go == 'true'
        with:
          # The branch, not the failing SHA: a detached HEAD cannot be pushed.
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ secrets.CLAUDE_WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: steps.guard.outputs.go == 'true'
        with:
          components: clippy, rustfmt

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.guard.outputs.go == 'true'
        with:
          version: 9

      # After pnpm: `cache: pnpm` asks pnpm where its store is.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.guard.outputs.go == 'true'
        with:
          node-version: 20
          cache: pnpm

      - name: Linux dependencies
        if: steps.guard.outputs.go == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libudev-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.guard.outputs.go == 'true'
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
        if: steps.guard.outputs.go == 'true'

      - uses: anthropics/claude-code-action@56cf60fde42f7b19c3abfd5c9c48b69a1288461f # v1.0.222
        id: claude
        if: steps.guard.outputs.go == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.CLAUDE_WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}
          # `workflow_run` carries no PR the action can read, so the prompt names it.
          prompt: |
            CI failed on pull request #${{ steps.guard.outputs.pr }}, branch
            `${{ github.event.workflow_run.head_branch }}`. You are on that
            branch now. Fix it. This is attempt
            ${{ steps.guard.outputs.attempt }} of 3.

            Read `CLAUDE.md` first, and `.github/claude-instructions.md` after
            it.

            **Start from what the run actually said**, not from what the diff
            looks like it should do:

            ```bash
            gh run view ${{ github.event.workflow_run.id }} --log-failed
            ```

            Failing run: ${{ github.event.workflow_run.html_url }}

            Then:

            - **Push the fix to this branch.** A pull request is already open.
              Do not open another, and do not open one against `main`.
            - **This branch may not be yours.** It is whoever's pull request
              went red, so push the smallest thing that makes CI green and
              leave the rest of their work alone. Do not tidy, rename or
              refactor anything the failure did not require.
            - **A failure on one platform only is a finding, not a flake.**
              Windows and macOS diverge from Linux here more than anywhere
              else, and roughly a tenth of the Rust never compiles on the
              development machine at all. Do not rerun and hope.
            - **If the test is what is wrong, you may change the test** — but
              say which you concluded and why in a comment on the pull request.
              Changing a test until it passes is how a green pull request stops
              meaning anything, and it is the failure this repository is least
              able to see.
            - Run `pnpm test` and `cd src-tauri && cargo clippy --all-targets
              -- -D warnings` before you push. Pushing a guess costs another
              full CI run and one of only three attempts.
            - **If you cannot work out why it failed, or the fix needs a
              decision that is not yours, stop.** Comment on the pull request
              with what you found and the one question you need answered. A
              confident patch for the wrong problem costs more to review than
              nothing at all.
          claude_args: |
            --allowed-tools "Bash(cd:*),Bash(pnpm:*),Bash(cargo:*),Bash(node:*),Bash(git:*),Bash(tools/:*),Bash(python3:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr edit:*),Bash(gh pr comment:*),Bash(gh run list:*),Bash(gh run view:*),Bash(gh workflow view:*)"
            --append-system-prompt-file .github/claude-instructions.md

      # A run that pushed nothing and said nothing would stall the branch for good,
      # since nothing fires until it changes. So: push any change (even uncommitted),
      # label a question needs-decision, or fail so the retry job runs.
      - name: Did it push?
        id: deliver
        if: always() && steps.guard.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ steps.guard.outputs.pr }}
          ATTEMPT: ${{ steps.guard.outputs.attempt }}
          COMMENTS_BEFORE: ${{ steps.guard.outputs.comments }}
          START_SHA: ${{ github.event.workflow_run.head_sha }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Log what the agent was refused, so the allowlist can be tuned from successful
          # runs too. A half-written record (timeout) must not abort the push below.
          why='The action left no execution record, so it probably failed before the agent started.'
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
            found=$(jq -r '
              [.[] | select(.type == "result")][0] // empty
              | "The agent returned after \(.num_turns) turns"
                + (if .is_error then " with an error" else " without error" end)
                + (if (.permission_denials // []) | length > 0
                   then ", and was refused \(.permission_denials | length) tool call(s):\n"
                     + ([.permission_denials[] | "  - \(.tool_name): \((.tool_input.command // .tool_input) | tostring | .[0:120])"] | join("\n"))
                   else ", and was refused nothing." end)
            ' "$EXECUTION_FILE") \
              || found="The action's execution record could not be read."
            if [ -n "$found" ]; then why=$found; fi
          fi
          echo "$why"

          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git -c user.name='claude[salvage]' -c user.email='noreply@anthropic.com' \
              commit -q -m "Salvage what repair attempt $ATTEMPT on #$NUMBER had changed when it stopped"
          fi
          if [ "$(git rev-parse HEAD)" != "$START_SHA" ]; then
            # Uses the checkout's PAT so CI runs on the push; a GITHUB_TOKEN push would not.
            git push -q origin HEAD
            echo "Attempt $ATTEMPT pushed $(git rev-parse --short HEAD); CI decides the rest."
            exit 0
          fi

          now=$(gh pr view "$NUMBER" --json comments --jq '.comments | length')
          if [ "$now" -gt "$COMMENTS_BEFORE" ]; then
            gh pr edit "$NUMBER" --add-label needs-decision
            echo "Attempt $ATTEMPT stopped to ask; labelled needs-decision."
            exit 0
          fi

          if [ "$ATTEMPT" -ge 3 ]; then
            next='That was the last of three attempts, so this is now a question for a person.'
            gh pr edit "$NUMBER" --add-label needs-decision
          else
            next='The branch is exactly as it was, so this counts as an attempt and the failed CI run is being retried to start the next one.'
          fi
          printf '%s\n\n%s\n\n%s\n' \
            "**Repair attempt $ATTEMPT pushed nothing and said nothing.** $why" \
            "$next" \
            "[This run]($RUN_URL)" > stalled.md
          gh pr comment "$NUMBER" --body-file stalled.md
          echo "stalled=true" >> "$GITHUB_OUTPUT"
          echo "::error::Attempt $ATTEMPT on #$NUMBER pushed nothing and said nothing. $why"
          exit 1

  # A stalled attempt leaves the branch untouched, so nothing fires again. Re-running
  # the failed CI run starts the next attempt, still capped at three by the guard.
  # A separate job so the agent's job never holds `actions: write`.
  retry:
    needs: repair
    if: always() && needs.repair.outputs.stalled == 'true' && needs.repair.outputs.attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run rerun "$RUN_ID" --failed
