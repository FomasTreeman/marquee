# CI goes red on one of Claude's own pull requests. Claude fixes it.
#
# This was the last step in the loop that needed a person for no reason. A run
# opened a pull request, CI failed on Windows two minutes later, and the branch
# sat there until somebody noticed and typed `@claude`. Everything either side
# of it was already automatic.
#
# ---------------------------------------------------------------------------
# `workflow_run` is the privileged trigger and the one to be careful with. It
# runs from the default branch, with secrets and write access, whatever the run
# that triggered it was -- so a pull request from a fork, whose own CI run
# deliberately has no secrets at all, could otherwise reach them through here.
# Two conditions in the `if:` below close that:
#
#     head_repository.full_name == github.repository    not a fork
#
# That one is not decoration. Take it out and this file becomes the standard
# workflow_run escalation, and it will not look any different while it is one.
# A branch in this repository can only have been pushed by somebody with write
# access, which is the property being relied on.
#
# It used to also require the branch to be named `claude/` or `replay/`, and
# that was scope rather than security -- the fork check above already carries
# the whole of the guarantee. What the prefix bought was a promise that the
# agent only ever pushed to branches it had made itself, and what it cost was
# the case this exists for: a pull request goes red, and because the branch is
# named after a person nothing picks it up. The guard below still requires an
# open, non-draft pull request and still stops after three attempts, so the
# blast radius is a branch somebody is actively asking for review on.
#
# The other thing to know: **a workflow_run workflow only fires once it is on
# the default branch.** This file does nothing on the pull request that adds
# it. The first real proof it works is the first red Claude PR after it merges.
# ---------------------------------------------------------------------------

name: CI repair

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# Per branch, and not cancelling: a second failure arriving while a repair is
# still pushing should queue behind it, not race it to the same ref.
concurrency:
  group: ci-repair-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != 'main'
    runs-on: ubuntu-latest
    outputs:
      stalled: ${{ steps.deliver.outputs.stalled }}
      attempt: ${{ steps.guard.outputs.attempt }}
    # An agent run plus a full toolchain install. Generous, but bounded:
    # the failure mode of an unattended loop is not one long run, it is a
    # run nobody is watching that never ends.
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write
      issues: write
      # Read, not write. Reading the failed run is the whole job; starting one
      # is not, and `gh workflow run release.yml` cuts a release.
      actions: read

    steps:
      # Three ways this should not run, all of them cheap to check and all of
      # them expensive to get wrong -- the failure mode of an unattended loop
      # is not one bad run, it is forty.
      - name: Is this still worth doing?
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          # Through the environment rather than interpolated into the script.
          # A branch name is attacker-controlled in the general case, and
          # `${{ }}` is substituted into the shell before bash ever sees it --
          # the injection this whole file is written to avoid.
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          say() { echo "go=false" >> "$GITHUB_OUTPUT"; echo "$1"; exit 0; }

          pr=$(gh pr list --head "$BRANCH" --state open \
                 --json number,isDraft --jq '.[0] // empty')
          [ -n "$pr" ] || say "No open pull request for $BRANCH."

          number=$(echo "$pr" | jq -r .number)
          [ "$(echo "$pr" | jq -r .isDraft)" = "false" ] \
            || say "#$number is a draft, which means it is not finished yet."

          # A push that landed while CI was still running leaves this failure
          # describing code that no longer exists. Fixing it would mean fixing
          # something nobody has, and the newer run will call us back anyway.
          newest=$(gh run list --workflow CI --branch "$BRANCH" --limit 1 \
                     --json databaseId --jq '.[0].databaseId // empty')
          [ "$newest" = "$RUN_ID" ] \
            || say "Run $RUN_ID is not the newest for $BRANCH ($newest); stale."

          # Three goes, then it is a person's problem. An agent that cannot fix
          # a failure in three attempts is not going to find it on the ninth,
          # and each one costs a full run of subscription usage.
          attempts=$(gh pr view "$number" --json comments \
                       --jq '[.comments[] | select(.body | contains("<!-- ci-repair -->"))] | length')
          if [ "$attempts" -ge 3 ]; then
            gaveup=$(gh pr view "$number" --json comments \
                       --jq '[.comments[] | select(.body | contains("<!-- ci-repair-gave-up -->"))] | length')
            if [ "$gaveup" -eq 0 ]; then
              printf '%s\n\n%s\n\n%s\n\n%s\n' \
                '<!-- ci-repair-gave-up -->' \
                '**CI has failed three times here and I have stopped trying.**' \
                'Three attempts that do not fix it usually means the failure is not the one the diff is about -- a platform difference, a flake, or something that needs a decision rather than a patch. Worth a look rather than a fourth run.' \
                '`@claude` on this pull request restarts it if you disagree.' \
                > gave-up.md
              gh pr comment "$number" --body-file gave-up.md
              # The comment above is the message; the label is what the board
              # reads. Losing the label is survivable, losing it quietly is not
              # -- the card would sit in In Progress with nothing progressing.
              gh pr edit "$number" --add-label needs-decision \
                || echo "::warning::commented on #$number but could not label it needs-decision"
            fi
            say "#$number has had $attempts repair attempts; stopping."
          fi

          # Posted before Claude runs, not after, so a run that dies partway
          # still counts against the three. Otherwise a crash loops forever.
          printf '%s\n\n%s\n' \
            '<!-- ci-repair -->' \
            "CI failed -- repair attempt $((attempts + 1)) of 3. [Failed run]($RUN_URL)" \
            > attempt.md
          gh pr comment "$number" --body-file attempt.md

          {
            echo "go=true"
            echo "pr=$number"
            echo "attempt=$((attempts + 1))"
            # Counted after the attempt comment, so a comment the agent leaves
            # is the only thing that can raise it.
            echo "comments=$(gh pr view "$number" --json comments --jq '.comments | length')"
          } >> "$GITHUB_OUTPUT"
          echo "Repairing #$number, attempt $((attempts + 1))."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.guard.outputs.go == 'true'
        with:
          # The branch, not the failing commit: the fix has to be pushable, and
          # a detached HEAD is not.
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ secrets.CLAUDE_WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: steps.guard.outputs.go == 'true'
        with:
          components: clippy, rustfmt

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: steps.guard.outputs.go == 'true'
        with:
          version: 9

      # After pnpm: `cache: pnpm` asks pnpm where its store is.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.guard.outputs.go == 'true'
        with:
          node-version: 20
          cache: pnpm

      - name: Linux dependencies
        if: steps.guard.outputs.go == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libudev-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.guard.outputs.go == 'true'
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
        if: steps.guard.outputs.go == 'true'

      - uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1.0.210
        id: claude
        if: steps.guard.outputs.go == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.CLAUDE_WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}
          # Everything the run needs is spelled out here. `workflow_run` is not
          # an event the action can read a pull request out of by itself, so
          # nothing below should assume it knows which one this is.
          prompt: |
            CI failed on pull request #${{ steps.guard.outputs.pr }}, branch
            `${{ github.event.workflow_run.head_branch }}`. You are on that
            branch now. Fix it. This is attempt
            ${{ steps.guard.outputs.attempt }} of 3.

            Read `CLAUDE.md` first, and `.github/claude-instructions.md` after
            it.

            **Start from what the run actually said**, not from what the diff
            looks like it should do:

            ```bash
            gh run view ${{ github.event.workflow_run.id }} --log-failed
            ```

            Failing run: ${{ github.event.workflow_run.html_url }}

            Then:

            - **Push the fix to this branch.** A pull request is already open.
              Do not open another, and do not open one against `main`.
            - **This branch may not be yours.** It is whoever's pull request
              went red, so push the smallest thing that makes CI green and
              leave the rest of their work alone. Do not tidy, rename or
              refactor anything the failure did not require.
            - **A failure on one platform only is a finding, not a flake.**
              Windows and macOS diverge from Linux here more than anywhere
              else, and roughly a tenth of the Rust never compiles on the
              development machine at all. Do not rerun and hope.
            - **If the test is what is wrong, you may change the test** — but
              say which you concluded and why in a comment on the pull request.
              Changing a test until it passes is how a green pull request stops
              meaning anything, and it is the failure this repository is least
              able to see.
            - Run `pnpm test` and `cd src-tauri && cargo clippy --all-targets
              -- -D warnings` before you push. Pushing a guess costs another
              full CI run and one of only three attempts.
            - **If you cannot work out why it failed, or the fix needs a
              decision that is not yours, stop.** Comment on the pull request
              with what you found and the one question you need answered. A
              confident patch for the wrong problem costs more to review than
              nothing at all.
          claude_args: |
            --allowed-tools "Bash(cd:*),Bash(pnpm:*),Bash(cargo:*),Bash(node:*),Bash(git:*),Bash(tools/:*),Bash(python3:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr edit:*),Bash(gh pr comment:*),Bash(gh run list:*),Bash(gh run view:*),Bash(gh workflow view:*)"
            --append-system-prompt-file .github/claude-instructions.md

      # The run above went green on #78 having pushed nothing and said
      # nothing: twenty-eight turns, six tool calls refused, and a branch left
      # exactly as red as it found it. Nothing fires again until that branch
      # changes, so one silent attempt was a permanent stall with two of the
      # three tries unspent.
      #
      # So: whatever it changed is pushed, even uncommitted -- CI on the push
      # is the next attempt, and a wrong fix that says it is one is cheaper
      # than a discarded one. A comment without a push is a question, and gets
      # the label a person reads. Nothing at all is reported on the pull
      # request with why, and the job fails so the retry below runs.
      - name: Did it push?
        id: deliver
        if: always() && steps.guard.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ steps.guard.outputs.pr }}
          ATTEMPT: ${{ steps.guard.outputs.attempt }}
          COMMENTS_BEFORE: ${{ steps.guard.outputs.comments }}
          START_SHA: ${{ github.event.workflow_run.head_sha }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # What it was refused, from the action's record, logged whether or
          # not it delivered. Two of #78's attempts were refused six and then
          # eighteen calls and only the stalled report would have said which;
          # an allowlist tuned only from failures never learns what the
          # successful runs kept bumping into.
          #
          # A record that will not parse -- a run killed at the timeout can
          # leave it half-written -- must not abort this step: what follows
          # is the push that keeps the branch, and the diagnosis is worth
          # less than the branch.
          why='The action left no execution record, so it probably failed before the agent started.'
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
            found=$(jq -r '
              [.[] | select(.type == "result")][0] // empty
              | "The agent returned after \(.num_turns) turns"
                + (if .is_error then " with an error" else " without error" end)
                + (if (.permission_denials // []) | length > 0
                   then ", and was refused \(.permission_denials | length) tool call(s):\n"
                     + ([.permission_denials[] | "  - \(.tool_name): \((.tool_input.command // .tool_input) | tostring | .[0:120])"] | join("\n"))
                   else ", and was refused nothing." end)
            ' "$EXECUTION_FILE") \
              || found="The action's execution record could not be read."
            if [ -n "$found" ]; then why=$found; fi
          fi
          echo "$why"

          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git -c user.name='claude[salvage]' -c user.email='noreply@anthropic.com' \
              commit -q -m "Salvage what repair attempt $ATTEMPT on #$NUMBER had changed when it stopped"
          fi
          if [ "$(git rev-parse HEAD)" != "$START_SHA" ]; then
            # Through the checkout's credentials, which are the PAT when there
            # is one, so CI runs on it. A push through GITHUB_TOKEN would
            # sit there unchecked.
            git push -q origin HEAD
            echo "Attempt $ATTEMPT pushed $(git rev-parse --short HEAD); CI decides the rest."
            exit 0
          fi

          now=$(gh pr view "$NUMBER" --json comments --jq '.comments | length')
          if [ "$now" -gt "$COMMENTS_BEFORE" ]; then
            gh pr edit "$NUMBER" --add-label needs-decision
            echo "Attempt $ATTEMPT stopped to ask; labelled needs-decision."
            exit 0
          fi

          if [ "$ATTEMPT" -ge 3 ]; then
            next='That was the last of three attempts, so this is now a question for a person.'
            gh pr edit "$NUMBER" --add-label needs-decision
          else
            next='The branch is exactly as it was, so this counts as an attempt and the failed CI run is being retried to start the next one.'
          fi
          printf '%s\n\n%s\n\n%s\n' \
            "**Repair attempt $ATTEMPT pushed nothing and said nothing.** $why" \
            "$next" \
            "[This run]($RUN_URL)" > stalled.md
          gh pr comment "$NUMBER" --body-file stalled.md
          echo "stalled=true" >> "$GITHUB_OUTPUT"
          echo "::error::Attempt $ATTEMPT on #$NUMBER pushed nothing and said nothing. $why"
          exit 1

  # A stalled attempt leaves the branch untouched, and an untouched branch
  # fires nothing. Re-running the CI run that started this makes it complete
  # again, which starts the next attempt -- bounded by the three the guard
  # counts, since the attempt comment was posted before the agent ran.
  #
  # A separate job so `actions: write` is a permission the agent's job never
  # has: `gh workflow run release.yml` cuts a release, and the token that can
  # do that should not be in the same environment as a prompt read from a
  # pull request.
  retry:
    needs: repair
    if: always() && needs.repair.outputs.stalled == 'true' && needs.repair.outputs.attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run rerun "$RUN_ID" --failed
