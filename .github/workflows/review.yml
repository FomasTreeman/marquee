# A second opinion on every pull request, before you read it.
#
# Not a gate -- it comments, it does not approve or block. The point is that
# you arrive at a pull request already knowing where to look, rather than
# reading three hundred lines cold at eleven at night.
#
# It reviews Claude's own pull requests too. That is not as odd as it sounds:
# a fresh run with no memory of writing the thing, reading only the diff, is a
# genuinely different reader from the one that wrote it.
#
# To ask for a review after a merge, or a second pass on anything, comment
# `@claude review this` -- claude.yml handles that.

name: Review

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts are work in progress by definition, and `no-ai` opts out.
    #
    # Dependabot is excluded by name rather than by being a bot: Claude's own
    # pull requests arrive as a bot too, and reviewing those is the point --
    # see the header. What is not the point is spending a run of subscription
    # usage reading a one-line SHA bump every Monday.
    #
    # Forks are excluded because they cannot work, not because they are
    # unwelcome. A `pull_request` from a fork carries no secrets, so
    # `claude_code_oauth_token` arrives empty and the action fails -- attributed
    # to somebody's first contribution, for a reason that has nothing to do with
    # it. ci-repair.yml already draws this line; the repository is public now
    # and this one had not caught up.
    if: |
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'no-ai')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # So the check at the end can tell this run's comment from an older one.
      - id: started
        run: echo "at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1.0.210
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review the pull request this run is for, and post ONE comment on it.

            Read CLAUDE.md first. Review against this project's standards, not
            generic ones.

            The four things that have actually gone wrong here, in order:

            1. **Does the new test fail without the fix?** A test that passes
               against the broken code is worse than no test, and that has
               shipped here more than once. If the description does not say it
               was checked, say so.
            2. **Is the failure audible now?** Silent degradation is this
               project's whole disease. A fix that leaves the next occurrence
               invisible is half a fix. Look for discarded errors with no log
               call and no comment giving a reason.
            3. **Is it the smallest change that works?** Look for scope that
               crept in, and for two fixes in one pull request -- that cannot
               be half-reverted.
            4. **Do the comments say why, not what?**

            Be specific and short. Quote the line, say what breaks and when.

            **If it looks good, say so in one line and stop.** A review that
            manufactures three nitpicks to look thorough is worse than no
            review, because it teaches the reader to skim.

            Do not approve, do not request changes, do not push commits. A
            comment is the whole job.

            You have `git`, `gh pr view`, `gh pr diff` and `gh pr comment`, and
            nothing else. This job is a checkout with no toolchain, so read the
            diff and the history -- do not try to run the suite, and do not
            claim a change passes or fails as though you had.

            Post the comment with:

            ```bash
            gh pr comment ${{ github.event.pull_request.number }} --body-file review.md
            ```

          # `gh pr comment` is the deliverable and it was not granted. For its
          # first sixty-nine runs this workflow had `git` alone, the agent was
          # refused every way it tried to post, gave up, and the run reported
          # success -- so every pull request went out "reviewed" with no
          # review on it, and nothing anywhere said so. tools/check-agent-tools.py
          # now holds this list to the prompt above, and the step below holds
          # the run to having posted.
          claude_args: |
            --allowed-tools "Bash(git:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"

      # A review that posted nothing is the failure this workflow had for two
      # days without anyone noticing, so it says so where the review should
      # have been. A comment rather than a red job: nothing gates on this
      # workflow, and the board reads a failed check on the head commit as
      # the pull request's CI failing, which would be a second wrong signal.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STARTED: ${{ steps.started.outputs.at }}
        with:
          script: |
            const { owner, repo } = context.repo
            const number = context.payload.pull_request.number
            const since = Date.parse(process.env.STARTED)
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: number, per_page: 100,
            })
            const posted = comments.some((c) =>
              c.user?.type === 'Bot' && Date.parse(c.created_at) >= since)
            if (posted) return
            core.warning(`The review ran and posted nothing on #${number}.`)
            await github.rest.issues.createComment({
              owner, repo, issue_number: number,
              body: '<!-- review-missing -->\n'
                + 'The review ran and posted nothing. That is the workflow failing, not the pull'
                + ` request passing: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            })
