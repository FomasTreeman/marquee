name: Bug
description: Something Marquee does wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        The failure mode is not Claude refusing — it is Claude confidently
        fixing the wrong thing. The fields below are what stops that.

  - type: dropdown
    id: who
    attributes:
      label: Who should fix this
      description: >
        Answered here so the issue arrives already routed. An issue that
        reaches the board with neither answer sits in a queue nobody is
        working through, which is how a to-do list quietly becomes a graveyard.
      options:
        - Claude — pick it up now and open a pull request
        - Claude — but read the thread first, there is context above
        - Me — do not touch it
    validations: { required: true }

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what happened, and what you expected. In that order.
      placeholder: |
        Typed "rocket league" into Add a game.
        Got "Nothing found. Try a shorter name."
        Expected it to find Rocket League — I own it.
    validations: { required: true }

  - type: input
    id: exact
    attributes:
      label: The exact input
      description: >
        The string you typed, or the game involved. "Rocket League returns
        nothing" is a bug report; "search is broken" is a mood.
      placeholder: rocket league

  - type: dropdown
    id: platform
    attributes:
      label: Which machine
      description: >
        Windows and macOS diverge here more than anywhere else — roughly a
        tenth of the Rust never compiles on the development machine.
      options: [Windows, macOS, Linux, Steam Deck, More than one]
    validations: { required: true }

  - type: dropdown
    id: input
    attributes:
      label: What you were using
      description: Controller-first, so this matters more than it usually would.
      options: [Controller, Keyboard, Mouse, More than one]

  - type: textarea
    id: log
    attributes:
      label: The log
      description: >
        Most of this app's failures are silent on screen and loud in the log —
        that is deliberate, so please use it. Windows
        `%LOCALAPPDATA%\Marquee\logs\marquee.log`, macOS
        `~/Library/Logs/Marquee/marquee.log`, Linux
        `~/.local/state/marquee/marquee.log`.
      render: text
