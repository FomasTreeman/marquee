# Actions are pinned to commit SHAs so a moved or compromised tag cannot
# change what runs. Dependabot keeps those pins current, rewriting the SHA and
# its `# vX.Y.Z` comment together.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Action bumps ship nothing to users; release.yml skips `no-release`.
    labels:
      - no-release
      - dependencies
    commit-message:
      prefix: ""
    open-pull-requests-limit: 5

# No cargo or npm: dependencies are kept few on purpose (docs/PLAN.md §3).
# Security fixes for them come from Dependabot security updates, a repository
# setting.
