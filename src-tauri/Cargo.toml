[package]
name = "marquee"
version = "0.2.2"
description = "A controller-first game launcher"
license = "PolyForm-Strict-1.0.0"
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri v2's lib/bin split, kept although we are desktop-only.
name = "marquee_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Tauri sets `dev = !custom-protocol`, ignoring the build profile. Removing this
# ships a build that loads http://localhost:1420 instead of its own interface.
# `tauri dev` runs with --no-default-features to turn it off.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs reads frontendDist out of tauri.conf.json so the path cannot drift.
serde_json = "1"


[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Shared with reqwest; used to pass response bodies around without copying.
bytes = "1"

# Native file picker, for pointing a hand-added game at its executable.
tauri-plugin-dialog = "2"

# Gamepad input, with SDL_GameControllerDB mappings for off-brand pads.
gilrs = "0.11"

# User data with real migrations; bundled so no system SQLite is needed.
rusqlite = { version = "0.32", features = ["bundled"] }

# Artwork resizing, with only the codecs Steam serves.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Steam store metadata; rustls so Linux builds do not depend on system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

# Only so the app can restart itself after an update lands.
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
# SetThreadExecutionState, to stop the screen blanking during controller use.
windows-sys = { version = "0.59", features = [
    "Win32_System_Power",
    # ShellExecuteW, to open steam:// without a console window. See run.rs.
    "Win32_UI_Shell",
] }
# Reads Steam's install path from the registry, as many move it off C:.
winreg = "0.52"

# Over-the-air updates; desktop-only per the plugin docs. See docs/UPDATES.md.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

[profile.dev]
# We dogfood the debug build, so it gets some optimisation.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
