[package]
name = "marquee"
version = "0.0.1"
description = "A controller-first game launcher"
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri v2 wants the app in a lib so mobile targets can link it. We are
# desktop-only, but keeping the split costs nothing and matches every example.
name = "marquee_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
# The debug build is what we dogfood, so it should not feel like a debug build.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
