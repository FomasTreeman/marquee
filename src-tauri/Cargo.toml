[package]
name = "marquee"
version = "0.0.1"
description = "A controller-first game launcher"
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri v2 wants the app in a lib so mobile targets can link it. We are
# desktop-only, but keeping the split costs nothing and matches every example.
name = "marquee_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Shared with reqwest; used to pass response bodies around without copying.
bytes = "1"

# Native file picker, for pointing a hand-added game at its executable.
tauri-plugin-dialog = "2"

# Gamepad input. Uses SDL_GameControllerDB mappings, which is what makes an
# off-brand pad work without a per-device patch. See src/input.rs.
gilrs = "0.11"

# Steam's store endpoints, for names and metadata. rustls rather than the
# system TLS stack so a Linux build does not depend on which OpenSSL the
# distribution shipped.
# Bundled so there is no system SQLite dependency on any of the three
# platforms, and so the version is ours rather than the distribution's.
rusqlite = { version = "0.32", features = ["bundled"] }

# Bundled so there is no system SQLite dependency to differ across the three
# platforms. docs/PLAN.md §8: user data must survive, so it gets a real
# database with real migrations rather than a JSON file.

# Artwork resizing on ingest. Only the codecs we actually fetch, so the build
# does not carry decoders for formats Steam never serves.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

[target.'cfg(windows)'.dependencies]
# Steam records its own install path in the registry. Reading it beats
# guessing Program Files, because a lot of people move Steam to another drive.
winreg = "0.52"

[profile.dev]
# The debug build is what we dogfood, so it should not feel like a debug build.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
